  .outs{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:7px}

  .tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;
    text-transform:uppercase;padding:3px 8px;border-radius:999px;margin-top:7px;
    background:var(--surface2);border:1px solid var(--line);color:var(--muted)}

    font-size:12px;text-decoration:underline;padding:8px 0 0;cursor:pointer}
  .more{width:100%;padding:14px;margin-bottom:10px}

var cur = 0, q = '', LIMIT = 50, shown = LIMIT;
var ASKING = {};

var KT = 'wlText', KC = 'wlCall';
var TEXTED = {}, CALLED = {}, STORED = true;
try { TEXTED = JSON.parse(localStorage.getItem(KT) || '{}') || {}; } catch (e) { STORED = false; }
try { CALLED = JSON.parse(localStorage.getItem(KC) || '{}') || {}; } catch (e) { STORED = false; }
function persist(){
  try {
    localStorage.setItem(KT, JSON.stringify(TEXTED));
    localStorage.setItem(KC, JSON.stringify(CALLED));
  } catch (e) { STORED = false; }
}

var IOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
function smsHref(num, body){ return 'sms:' + num + (IOS ? '&' : '?') + 'body=' + encodeURIComponent(body); }

var OUTS = [
  { k:'noanswer', t:'No answer' },
  { k:'callback', t:'Call back', cls:' warn' },
  { k:'notint',   t:'Not interested' },
  { k:'booked',   t:'Booked', cls:' good' }
];
function outName(k){
  for (var i = 0; i < OUTS.length; i++) { if (OUTS[i].k === k) return OUTS[i].t; }
  return 'Called';
}

function everyone(){
  var all = [];
  for (var i = 0; i < CAMPS.length; i++) { all = all.concat(CAMPS[i].people); }
  return all;
}

function tally(){
  var all = everyone(), nc = 0, nt = 0, nb = 0, touched = 0;
  all.forEach(function (p) {
    if (CALLED[p.i]) nc++;
    if (TEXTED[p.i]) nt++;
    if (CALLED[p.i] === 'booked') nb++;
    if (CALLED[p.i] || TEXTED[p.i]) touched++;
  });
  document.getElementById('tCall').textContent = nc;
  document.getElementById('tText').textContent = nt;
  document.getElementById('tBook').textContent = nb;
  document.getElementById('tLeft').textContent = all.length - touched;
}

function visible(){
  var people = CAMPS[cur].people;
  if (!q) return people;
  var s = q.toLowerCase();
  return people.filter(function (p) {
    return (p.n || '').toLowerCase().indexOf(s) >= 0
        || (p.a || '').toLowerCase().indexOf(s) >= 0
        || (p.p || '').indexOf(s) >= 0;
  });
}

function render(){
  var cb = document.getElementById('camps');
  cb.textContent = '';
  CAMPS.forEach(function (c, i) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip';
    b.textContent = c.title + ' (' + c.people.length + ')';
    b.setAttribute('aria-pressed', i === cur);
    b.addEventListener('click', function () { cur = i; shown = LIMIT; render(); });
    cb.appendChild(b);
  });

  document.getElementById('sub').textContent =
    CAMPS[cur].sub + (STORED ? '' : '   nothing is being remembered on this device');
  tally();

  var list = visible();
  var slice = list.slice(0, shown);
  document.getElementById('count').textContent =
    list.length + (list.length === 1 ? ' person' : ' people')
    + (list.length > slice.length ? ', showing ' + slice.length : '');

  var box = document.getElementById('list');
  box.textContent = '';
  if (!list.length) {
    var e = document.createElement('p');
    e.className = 'empty';
    e.textContent = q ? 'Nobody matches that.' : 'Nobody in this list.';
    box.appendChild(e);
    return;
  }

  slice.forEach(function (p) {
    var didText = !!TEXTED[p.i], didCall = !!CALLED[p.i];
    var r = document.createElement('div');
    r.className = 'row' + (didText ? ' texted' : '') + (didCall ? ' called' : '');

    var nm = document.createElement('div');
    nm.className = 'nm';
    nm.textContent = p.n || p.p;
    var me = document.createElement('div');
    me.className = 'me';
    me.textContent = p.p + (p.a ? '   ' + p.a : '') + (p.d >= 0 ? '   ' + p.d + ' m away' : '');
    r.appendChild(nm);
    r.appendChild(me);

    if (didCall) {
      var tg = document.createElement('div');
      tg.className = 'tag';
      tg.textContent = outName(CALLED[p.i]);
      r.appendChild(tg);
    }

    var acts = document.createElement('div');
    acts.className = 'acts';

    var call = document.createElement('a');
    call.className = 'b call' + (didCall ? ' done' : '');
    call.textContent = didCall ? 'Call again' : 'Call';
    call.href = 'tel:' + p.p;
    call.addEventListener('click', function () {
      ASKING[p.i] = 1;
      setTimeout(render, 400);
    });

    var text = document.createElement('a');
    text.className = 'b' + (didText ? ' done' : '');
    text.textContent = didText ? 'Texted' : 'Text';
    text.href = smsHref(p.p, p.b);
    text.addEventListener('click', function () {
      TEXTED[p.i] = Date.now();
      persist();
      setTimeout(render, 400);
    });

    acts.appendChild(call);
    acts.appendChild(text);
    r.appendChild(acts);

    if (ASKING[p.i]) {
      var lab = document.createElement('p');
      lab.className = 'ask';
      lab.textContent = 'How did that call go?';
      r.appendChild(lab);
      var outs = document.createElement('div');
      outs.className = 'outs';
      OUTS.forEach(function (o) {
        var ob = document.createElement('button');
        ob.type = 'button';
        ob.className = 'o' + (o.cls || '');
        ob.textContent = o.t;
        ob.addEventListener('click', function () {
          CALLED[p.i] = o.k;
          delete ASKING[p.i];
          persist();
          render();
        });
        outs.appendChild(ob);
      });
      r.appendChild(outs);
    }

    var msg = document.createElement('div');
    msg.className = 'msg';
    msg.textContent = p.b;
    r.appendChild(msg);

    if (didText || didCall) {
      var u = document.createElement('button');
      u.type = 'button';
      u.className = 'undo';
      u.textContent = 'Clear this one';
      u.addEventListener('click', function () {
        delete TEXTED[p.i];
        delete CALLED[p.i];
        delete ASKING[p.i];
        persist();
        render();
      });
      r.appendChild(u);
    }
    box.appendChild(r);
  });

  if (list.length > slice.length) {
    var more = document.createElement('button');
    more.type = 'button';
    more.className = 'chip more';
    more.textContent = 'Show ' + Math.min(LIMIT, list.length - slice.length) + ' more';
    more.addEventListener('click', function () { shown += LIMIT; render(); });
    box.appendChild(more);
  }
}

document.getElementById('find').addEventListener('input', function (e) {
  q = e.target.value.trim();
  shown = LIMIT;
  render();
});

function copyOut(text, btn){
  var ok = false;
  try {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    ta.setSelectionRange(0, text.length);
    ok = document.execCommand('copy');
    document.body.removeChild(ta);
  } catch (e) { ok = false; }
  function win(){
    btn.textContent = 'Copied, paste it to Claude';
    setTimeout(function () { btn.textContent = "Copy today's results"; }, 2400);
  }
  if (ok) { win(); return; }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(win, function () { btn.textContent = 'Could not copy'; });
    return;
  }
  btn.textContent = 'Could not copy';
}

document.getElementById('export').addEventListener('click', function () {
  var d = new Date();
  var lines = ['Work list results ' + d.getFullYear() + '-'
    + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2)];
  everyone().forEach(function (p) {
    var bits = [];
    if (CALLED[p.i]) bits.push(outName(CALLED[p.i]));
    if (TEXTED[p.i]) bits.push('texted');
    if (bits.length) lines.push(p.i + '  ' + (p.n || '') + '  ' + bits.join(', '));
  });
  if (lines.length === 1) lines.push('nothing yet today');
  copyOut(lines.join('\n'), this);
});

render();
</script>
