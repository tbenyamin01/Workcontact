  var bits = [];
  if (pr.price) bits.push((pr.kind === 'sold' ? '' : 'guiding ') + pr.price);
  if (pr.beds) bits.push(pr.beds);
  if (pr.land) bits.push(pr.land);
  if (pr.when) bits.push(pr.when);
  return { head: pr.addr + (pr.kind === 'sold' ? '   SOLD' : '   ON MARKET'), line: bits.join('   ') };
}

/* ---------- a contact card ---------- */
function card(r){
  var t = today(), lg = LOG[r.i], tx = TEXTED[r.i];
  var didText = !!tx, didCall = !!lg;
  var el = document.createElement('div');
  el.className = 'row' + (didText ? ' texted' : '') + (didCall ? ' called' : '');

  var nm = document.createElement('div');
  nm.className = 'nm'; nm.textContent = r.n || r.p;
  var me = document.createElement('div');
  me.className = 'me';
  me.textContent = r.p + (r.a ? '   ' + r.a : '') + (r.d >= 0 ? '   ' + r.d + ' m away' : '');
  el.appendChild(nm); el.appendChild(me);

  var pl = propLine(PROPS[r.pr]);
  if (pl) {
    var pd = document.createElement('div');
    pd.className = 'prop';
    var pb = document.createElement('b'); pb.textContent = pl.head;
    var ps = document.createElement('span'); ps.textContent = pl.line;
    pd.appendChild(pb); pd.appendChild(ps);
    el.appendChild(pd);
  }

  var also = PEOPLE[r.i] && PEOPLE[r.i].also;
  if (also) {
    var ab = document.createElement('div');
    ab.className = 'also';
    ab.textContent = 'Same address as ' + also;
    el.appendChild(ab);
  }

  var hist = PEOPLE[r.i] && PEOPLE[r.i].h;
  if (hist) {
    var hb = document.createElement('div');
    hb.className = 'last';
    var hl = document.createElement('b'); hl.textContent = 'Last time you spoke';
    var ht = document.createElement('span'); ht.textContent = hist;
    hb.appendChild(hl); hb.appendChild(ht);
    el.appendChild(hb);
  }

  if (lg && lg.o) {
    var tg = document.createElement('div');
    tg.className = 'tag ' + lg.o;
    tg.textContent = outName(lg.o) + (lg.d ? '   ' + lg.d.slice(5) : '');
    el.appendChild(tg);
  }

  var acts = document.createElement('div');
  acts.className = 'acts';

  var call = document.createElement('a');
  call.className = 'b call' + (didCall ? ' done' : '');
  call.textContent = didCall ? 'Call again' : 'Call';
  call.href = 'tel:' + r.p;
  call.addEventListener('click', function () { ASKING[r.i] = 1; setTimeout(render, 400); });

  var text = document.createElement('a');
  text.className = 'b' + (didText ? ' done' : '');
  text.textContent = didText ? 'Texted' : 'Text';
  text.href = smsHref(r.p, r.b);
  text.addEventListener('click', function () {
    TEXTED[r.i] = { d: t, t: Date.now() };
    persist(); setTimeout(render, 400);
  });

  acts.appendChild(call);
  if (PEOPLE[r.i] && PEOPLE[r.i].nt) {
    var lmark = document.createElement('span');
    lmark.className = 'b noText';
    lmark.textContent = 'Landline, call only';
    acts.appendChild(lmark);
  } else {
    acts.appendChild(text);
  }
  el.appendChild(acts);

  if (ASKING[r.i] || lg) {
    var lab = document.createElement('p');
    lab.className = 'ask'; lab.textContent = 'How did that call go?';
    el.appendChild(lab);

    var outs = document.createElement('div');
    outs.className = 'outs';
    OUTS.forEach(function (o) {
      var ob = document.createElement('button');
      ob.type = 'button';
      ob.className = 'o' + (o.cls || '') + (lg && lg.o === o.k ? ' on' : '');
      ob.textContent = o.t;
      ob.addEventListener('click', function () {
        var dt = new Date();
        var stamp = dt.getDate() + '/' + (dt.getMonth() + 1) + '/' + dt.getFullYear();
        var prev = (LOG[r.i] && LOG[r.i].n) || '';
        var parts = prev ? prev.split('  ') : [];
        parts = parts.filter(function (x) {
          return x.indexOf('TB- ') !== 0 || x.indexOf(stamp) < 0;   // replace today's, keep older
        });
        parts.push('TB- ' + o.t + ' ' + stamp);
        LOG[r.i] = { o: o.k, d: t, t: Date.now(), n: parts.join('  ') };
        delete ASKING[r.i];
        persist(); render();
      });
      outs.appendChild(ob);
    });
    el.appendChild(outs);

    if (lg && lg.o) {
      var fu = document.createElement('a');
      fu.className = 'b fu';
      var isMiss = (lg.o === 'noanswer');
      fu.textContent = isMiss ? 'Text: I tried calling' : 'Text: thanks for your time';
      fu.href = smsHref(r.p, isMiss ? missedMsg(r.i) : thanksMsg(r.i));
      fu.addEventListener('click', function () {
        TEXTED[r.i] = { d: t, t: Date.now() };
        persist(); setTimeout(render, 400);
      });
      el.appendChild(fu);
    }

    var ta = document.createElement('textarea');
    ta.className = 'note';
    ta.placeholder = 'What they said. Saves as you type.';
    ta.value = (lg && lg.n) || '';
    ta.addEventListener('input', function () {
      if (!LOG[r.i]) LOG[r.i] = { o: '', d: t, t: Date.now(), n: '' };
      LOG[r.i].n = ta.value;
      LOG[r.i].t = Date.now();
      if (!LOG[r.i].d) LOG[r.i].d = t;
      persist();
    });
    el.appendChild(ta);
  }

  var cf = document.createElement('button');
  cf.type = 'button';
  cf.className = 'conf' + (CONF[r.i] ? ' on' : '');
  cf.textContent = CONF[r.i] ? 'Data confirmed' : 'Confirm this data';
  cf.addEventListener('click', function () {
    if (CONF[r.i]) delete CONF[r.i];
    else CONF[r.i] = { d: t, t: Date.now() };
    persist(); render();
  });
  el.appendChild(cf);

  var msg = document.createElement('div');
  msg.className = 'msg'; msg.textContent = r.b;
  el.appendChild(msg);

  if (didText || didCall) {
    var nx = document.createElement('button');
    nx.type = 'button'; nx.className = 'nextbtn';
    nx.textContent = 'Done, next contact';
    nx.addEventListener('click', function () {
      SUNK[r.i] = 1;
      render();
      window.scrollTo(0, 0);
    });
    el.appendChild(nx);

    var u = document.createElement('button');
    u.type = 'button'; u.className = 'undo'; u.textContent = 'Clear this one';
    u.addEventListener('click', function () {
      delete LOG[r.i]; delete TEXTED[r.i]; delete ASKING[r.i];
      persist(); render();
    });
    el.appendChild(u);
  }
  return el;
}

/* ---------- the properties list ---------- */
function renderProps(box, kind){
  var mine = propsOf(kind);
  if (!mine.length) {
    var e = document.createElement('p');
    e.className = 'empty';
    e.textContent = 'Nothing in the last scan.';
    box.appendChild(e);
    document.getElementById('count').textContent = '';
    return;
  }
  var reach = 0;
  mine.forEach(function (id) { reach += (PROPS[id].near || []).length; });
  document.getElementById('count').textContent =
    mine.length + (mine.length === 1 ? ' property' : ' properties') + ', '
    + reach + (reach === 1 ? ' neighbour' : ' neighbours') + ' between them';

  mine.forEach(function (id) {
    var pr = PROPS[id], n = (pr.near || []).length;
    var b2 = document.createElement('button');
    b2.type = 'button'; b2.className = 'prow';
    var t1 = document.createElement('b'); t1.textContent = pr.addr;
    var t2 = document.createElement('div'); t2.className = 'pm';
    var bits = [];
    if (pr.price) bits.push((pr.kind === 'sold' ? '' : 'guiding ') + pr.price);
    if (pr.beds) bits.push(pr.beds);
    if (pr.land) bits.push(pr.land);
    if (pr.when) bits.push(pr.when);
    t2.textContent = bits.join('   ');
    var t3 = document.createElement('span');
    t3.className = 'pc' + (n ? ' has' : '');
    t3.textContent = n ? n + ' to call within ' + RADIUS + ' m' : 'nobody within ' + RADIUS + ' m';
    b2.appendChild(t1); b2.appendChild(t2); b2.appendChild(t3);
    b2.addEventListener('click', function () { selProp = id; shown = LIMIT; render(); });
    box.appendChild(b2);
  });
}

function renderHistory(box){
  var byId = {};
  everyone().forEach(function (r) { byId[r.i] = r; });
  var rows = [];
  Object.keys(LOG).forEach(function (id) { rows.push({ id: id, e: LOG[id], r: byId[id] }); });
  Object.keys(TEXTED).forEach(function (id) {
    if (!LOG[id]) rows.push({ id: id, e: { o: '', d: TEXTED[id].d, t: TEXTED[id].t, n: '' }, r: byId[id] });
  });
  rows.sort(function (a, b) { return (b.e.t || 0) - (a.e.t || 0); });

  document.getElementById('count').textContent =
    rows.length ? rows.length + (rows.length === 1 ? ' entry' : ' entries') : '';

  if (!rows.length) {
    var e = document.createElement('p');
    e.className = 'empty';
    e.textContent = 'Nothing logged yet. Make a call, write a note, and it lands here.';
    box.appendChild(e); return;
  }

  var lastDay = '';
  rows.forEach(function (x) {
    var day = x.e.d || 'undated';
    if (day !== lastDay) {
      var h = document.createElement('div');
      h.className = 'hday';
      h.textContent = (day === today()) ? 'Today' : day;
      box.appendChild(h); lastDay = day;
    }
    var d = document.createElement('div');
    d.className = 'hrow';
    var nm = document.createElement('div');
    nm.className = 'nm'; nm.textContent = x.r ? (x.r.n || x.r.p) : x.id;
    var me = document.createElement('div');
    me.className = 'me';
    var bits = [];
    if (x.e.o) bits.push(outName(x.e.o));
    if (TEXTED[x.id]) bits.push('texted');
    if (x.r) bits.push(x.r.p);
    me.textContent = bits.join('   ');
    d.appendChild(nm); d.appendChild(me);
    if (x.e.n) {
      var n = document.createElement('div');
      n.className = 'hnote'; n.textContent = x.e.n;
      d.appendChild(n);
    }
    box.appendChild(d);
  });
}

function render(){
  var tabs = [{ id:'today', t:'Today' },
              { id:'sold',   t:'Just sold',     n:propsOf('sold').length },
              { id:'listed', t:'Just listed',   n:propsOf('listed').length },
              { id:'rest',   t:'Everyone else', n:REST_ROWS.length },
              { id:'all',    t:'All contacts',  n:ALL_ROWS.length },
              { id:'history', t:'History' }];

  var tb = document.getElementById('tabs');
  tb.textContent = '';
  tabs.forEach(function (x) {
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'chip';
    b.textContent = x.t + (x.n != null ? ' (' + x.n + ')' : '');
    b.setAttribute('aria-pressed', x.id === tab);
    b.addEventListener('click', function () { tab = x.id; selProp = null; shown = LIMIT; render(); });
    tb.appendChild(b);
  });

  var sub = '';
  if (tab === 'today') sub = 'Your next ' + TOP_N + ', call backs first';
  else if (tab === 'history') sub = 'Everything you have logged';
  else if (tab === 'rest') sub = 'Not near anything scanned';
  else if (tab === 'all') sub = 'Everyone. Use the search box.';
  else if (isPropTab(tab)) {
    sub = selProp ? propLine(PROPS[selProp]).line
                  : (tab === 'sold' ? 'Recent sales from the scan. Pick one to see who is near it.'
                                    : 'On the market now. Pick one to see who is near it.');
  }
  document.getElementById('sub').textContent =
    sub + (STORED ? '' : '   nothing is being remembered on this device');

  tally();
  var nConf = Object.keys(CONF).length;
  document.getElementById('expconf').textContent = nConf ? 'Confirmed data (' + nConf + ')' : 'Confirmed data';
  var showFind = !(tab === 'history' || (isPropTab(tab) && !selProp));
  document.getElementById('find').style.display = showFind ? '' : 'none';

  var box = document.getElementById('list');
  box.textContent = '';

  if (tab === 'history') { renderHistory(box); return; }
  if (isPropTab(tab) && !selProp) { renderProps(box, tab); return; }

  if (isPropTab(tab) && selProp) {
    var back = document.createElement('button');
    back.type = 'button'; back.className = 'back';
    back.textContent = (tab === 'sold') ? 'All recent sales' : 'All on the market';
    back.addEventListener('click', function () { selProp = null; shown = LIMIT; render(); });
    box.appendChild(back);
    var hd = document.createElement('div');
    hd.className = 'sec';
    hd.textContent = PROPS[selProp].addr + (PROPS[selProp].kind === 'sold' ? '   SOLD' : '   ON MARKET');
    box.appendChild(hd);
  }

  var list = visible().slice().sort(function (a, b) {
    return (SUNK[a.i] ? 1 : 0) - (SUNK[b.i] ? 1 : 0);
  });
  var slice = list.slice(0, shown);
  document.getElementById('count').textContent =
    list.length + (list.length === 1 ? ' person' : ' people')
    + (list.length > slice.length ? ', showing ' + slice.length : '');

  if (!list.length) {
    var e = document.createElement('p');
    e.className = 'empty';
    e.textContent = q ? 'Nobody matches that.'
      : (tab === 'today' ? 'Nothing left for today. Good.' : 'Nobody in this one.');
    box.appendChild(e);
    if (tab === 'today') {
      var rf = document.createElement('button');
      rf.type = 'button'; rf.className = 'chip more';
      rf.textContent = 'Pull the next ' + TOP_N;
      rf.addEventListener('click', refreshToday);
      box.appendChild(rf);
    }
    return;
  }

  slice.forEach(function (r) { box.appendChild(card(r)); });

  if (list.length > slice.length) {
    var more = document.createElement('button');
    more.type = 'button'; more.className = 'chip more';
    more.textContent = 'Show ' + Math.min(LIMIT, list.length - slice.length) + ' more';
    more.addEventListener('click', function () { shown += LIMIT; render(); });
    box.appendChild(more);
  } else if (tab === 'today') {
    var t = today();
    var done = list.filter(function (r) {
      return (LOG[r.i] && LOG[r.i].d === t) || (TEXTED[r.i] && TEXTED[r.i].d === t);
    }).length;
    if (done >= list.length) {
      var rf2 = document.createElement('button');
      rf2.type = 'button'; rf2.className = 'chip more';
      rf2.textContent = 'All ' + list.length + ' done. Pull the next ' + TOP_N;
      rf2.addEventListener('click', refreshToday);
      box.appendChild(rf2);
    }
  }
}

document.getElementById('find').addEventListener('input', function (e) {
  q = e.target.value.trim(); shown = LIMIT; render();
});

function copyOut(text, btn){
  var ok = false;
  try {
    var ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', '');
    ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus(); ta.select(); ta.setSelectionRange(0, text.length);
    ok = document.execCommand('copy');
    document.body.removeChild(ta);
  } catch (e) { ok = false; }
  function win(){
    btn.textContent = 'Copied, paste it to Claude';
    setTimeout(function () { btn.textContent = "Copy today's results"; }, 2400);
  }
  if (ok) { win(); return; }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(win, function () { btn.textContent = 'Could not copy'; });
    return;
  }
  btn.textContent = 'Could not copy';
}

document.getElementById('export').addEventListener('click', function () {
  var t = today(), lines = ['Work list results ' + t];
  function nameOf(id){ return PEOPLE[id] ? PEOPLE[id].n : ''; }
  Object.keys(LOG).forEach(function (id) {
    var e = LOG[id];
    if (e.d !== t) return;
    lines.push(id + '  ' + nameOf(id) + '  ' + (e.o ? outName(e.o) : 'note only')
      + (TEXTED[id] && TEXTED[id].d === t ? ', texted' : '')
      + (e.n ? '  NOTE: ' + e.n.replace(/\n/g, ' ') : ''));
  });
  Object.keys(TEXTED).forEach(function (id) {
    if (TEXTED[id].d !== t || LOG[id]) return;
    lines.push(id + '  ' + nameOf(id) + '  texted');
  });
  if (lines.length === 1) lines.push('nothing yet today');
  copyOut(lines.join('\n'), this);
});

document.getElementById('expconf').addEventListener('click', function () {
  var ids = Object.keys(CONF).sort(function (a, b) { return (CONF[b].t || 0) - (CONF[a].t || 0); });
  var lines = ['Confirmed contact data, ' + ids.length + ' records, pulled ' + today()];
  ids.forEach(function (id) {
    var pp = PEOPLE[id];
    if (!pp) return;
    lines.push([id, pp.n, pp.p, pp.a, 'confirmed ' + CONF[id].d].join('  |  '));
  });
  if (!ids.length) lines.push('nothing confirmed yet');
  var bad = Object.keys(LOG).filter(function (id) { return LOG[id].o === 'wrong'; });
  if (bad.length) {
    lines.push('');
    lines.push('REMOVE, wrong number or moved, ' + bad.length + ' records');
    bad.forEach(function (id) {
      var pp = PEOPLE[id];
      lines.push([id, pp ? pp.n : '', pp ? pp.p : '', pp ? pp.a : ''].join('  |  '));
    });
  }
  copyOut(lines.join(String.fromCharCode(10)), this);
});

render();
</script>
