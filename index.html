text me back and I will work it out for you. No cost."},{"n":"Zorica Carione","p":"0414505684","a":"23 Daintree Drive","d":-1,"i":"w414505684","pr":"","b":"Hi Zorica, Thomas from Ausrealty. If you ever want to know what 23 Daintree Drive is worth, text me back and I will work it out for you. No cost."},{"n":"Zyrah Smith","p":"0450570979","a":"1 Yallum Court","d":-1,"i":"w450570979","pr":"","b":"Hi Zyrah, Thomas from Ausrealty. If you ever want to know what 1 Yallum Court is worth, text me back and I will work it out for you. No cost."}]}]};
var PROPS = DATA.props || {}, CAMPS = DATA.camps || [];
var tab = 'today', q = '', LIMIT = 50, shown = LIMIT, ASKING = {};
var TOP_N = 20;

/* LOG[id]    = {o:'booked', d:'2026-10-08', t:1791…, n:'note'}
   TEXTED[id] = {d:'2026-10-08', t:1791…}                        */
var KL = 'wlLog', KT = 'wlText';
var LOG = {}, TEXTED = {}, STORED = true;
try { LOG = JSON.parse(localStorage.getItem(KL) || '{}') || {}; } catch (e) { STORED = false; }
try { TEXTED = JSON.parse(localStorage.getItem(KT) || '{}') || {}; } catch (e) { STORED = false; }
Object.keys(TEXTED).forEach(function (k) {
  if (typeof TEXTED[k] === 'number') TEXTED[k] = { t: TEXTED[k], d: '' };
});
function persist(){
  try {
    localStorage.setItem(KL, JSON.stringify(LOG));
    localStorage.setItem(KT, JSON.stringify(TEXTED));
  } catch (e) { STORED = false; }
}

function today(){
  var d = new Date();
  return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
}
var IOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
function smsHref(num, body){ return 'sms:' + num + (IOS ? '&' : '?') + 'body=' + encodeURIComponent(body); }

var OUTS = [
  { k:'noanswer', t:'No answer' },
  { k:'callback', t:'Call back', cls:' warn' },
  { k:'notint',   t:'Not interested' },
  { k:'booked',   t:'Booked', cls:' good' }
];
function outName(k){
  for (var i = 0; i < OUTS.length; i++) { if (OUTS[i].k === k) return OUTS[i].t; }
  return 'Called';
}

function everyone(){
  var all = [];
  for (var i = 0; i < CAMPS.length; i++) { all = all.concat(CAMPS[i].people); }
  return all;
}

var TODAY_CACHE = null, TODAY_DAY = '';
function todayList(){
  var t = today();
  if (TODAY_CACHE && TODAY_DAY === t) return TODAY_CACHE;   // hold still while he works
  var out = [], seen = {};
  function add(p){ if (!seen[p.i]) { seen[p.i] = 1; out.push(p); } }

  everyone().filter(function (p) {
    return LOG[p.i] && LOG[p.i].o === 'callback' && LOG[p.i].d !== t;
  }).sort(function (a, b) { return (LOG[a.i].t || 0) - (LOG[b.i].t || 0); }).forEach(add);

  ['sold', 'listed', 'rest'].forEach(function (cid) {
    for (var i = 0; i < CAMPS.length; i++) {
      if (CAMPS[i].id !== cid) continue;
      CAMPS[i].people.filter(function (p) { return !LOG[p.i] && !TEXTED[p.i]; }).forEach(add);
    }
  });

  TODAY_DAY = t;
  TODAY_CACHE = out.filter(function (p) {
    return !(LOG[p.i] && LOG[p.i].o === 'notint') && !(LOG[p.i] && LOG[p.i].d === t);
  }).slice(0, TOP_N);
  return TODAY_CACHE;
}
function refreshToday(){ TODAY_CACHE = null; render(); }

function tally(){
  var all = everyone(), t = today(), nc = 0, nt = 0, nb = 0, touched = 0;
  all.forEach(function (p) {
    if (LOG[p.i] && LOG[p.i].d === t) nc++;
    if (TEXTED[p.i] && TEXTED[p.i].d === t) nt++;
    if (LOG[p.i] && LOG[p.i].o === 'booked') nb++;
    if (LOG[p.i] || TEXTED[p.i]) touched++;
  });
  document.getElementById('tCall').textContent = nc;
  document.getElementById('tText').textContent = nt;
  document.getElementById('tBook').textContent = nb;
  document.getElementById('tLeft').textContent = all.length - touched;
}

function current(){
  if (tab === 'today') return todayList();
  for (var i = 0; i < CAMPS.length; i++) { if (CAMPS[i].id === tab) return CAMPS[i].people; }
  return [];
}
function visible(){
  var people = current();
  if (!q) return people;
  var s = q.toLowerCase();
  return people.filter(function (p) {
    return (p.n || '').toLowerCase().indexOf(s) >= 0
        || (p.a || '').toLowerCase().indexOf(s) >= 0
        || (p.p || '').indexOf(s) >= 0;
  });
}

function propLine(pr){
  if (!pr) return null;
  var bits = [];
  if (pr.price) bits.push((pr.kind === 'sold' ? '' : 'guiding ') + pr.price);
  if (pr.beds) bits.push(pr.beds);
  if (pr.land) bits.push(pr.land);
  if (pr.when) bits.push(pr.when);
  return { head: pr.addr + (pr.kind === 'sold' ? '   SOLD' : '   ON MARKET'), line: bits.join('   ') };
}

function card(p){
  var t = today(), lg = LOG[p.i], tx = TEXTED[p.i];
  var didText = !!tx, didCall = !!lg;
  var r = document.createElement('div');
  r.className = 'row' + (didText ? ' texted' : '') + (didCall ? ' called' : '');

  var nm = document.createElement('div');
  nm.className = 'nm'; nm.textContent = p.n || p.p;
  var me = document.createElement('div');
  me.className = 'me';
  me.textContent = p.p + (p.a ? '   ' + p.a : '') + (p.d >= 0 ? '   ' + p.d + ' m away' : '');
  r.appendChild(nm); r.appendChild(me);

  var pl = propLine(PROPS[p.pr]);
  if (pl) {
    var pd = document.createElement('div');
    pd.className = 'prop';
    var pb = document.createElement('b'); pb.textContent = pl.head;
    var ps = document.createElement('span'); ps.textContent = pl.line;
    pd.appendChild(pb); pd.appendChild(ps);
    r.appendChild(pd);
  }

  if (lg && lg.o) {
    var tg = document.createElement('div');
    tg.className = 'tag ' + lg.o;
    tg.textContent = outName(lg.o) + (lg.d ? '   ' + lg.d.slice(5) : '');
    r.appendChild(tg);
  }

  var acts = document.createElement('div');
  acts.className = 'acts';

  var call = document.createElement('a');
  call.className = 'b call' + (didCall ? ' done' : '');
  call.textContent = didCall ? 'Call again' : 'Call';
  call.href = 'tel:' + p.p;
  call.addEventListener('click', function () { ASKING[p.i] = 1; setTimeout(render, 400); });

  var text = document.createElement('a');
  text.className = 'b' + (didText ? ' done' : '');
  text.textContent = didText ? 'Texted' : 'Text';
  text.href = smsHref(p.p, p.b);
  text.addEventListener('click', function () {
    TEXTED[p.i] = { d: t, t: Date.now() };
    persist(); setTimeout(render, 400);
  });

  acts.appendChild(call); acts.appendChild(text);
  r.appendChild(acts);

  if (ASKING[p.i] || lg) {
    var lab = document.createElement('p');
    lab.className = 'ask';
    lab.textContent = 'How did that call go?';
    r.appendChild(lab);

    var outs = document.createElement('div');
    outs.className = 'outs';
    OUTS.forEach(function (o) {
      var ob = document.createElement('button');
      ob.type = 'button';
      ob.className = 'o' + (o.cls || '') + (lg && lg.o === o.k ? ' on' : '');
      ob.textContent = o.t;
      ob.addEventListener('click', function () {
        var keep = (LOG[p.i] && LOG[p.i].n) || '';
        LOG[p.i] = { o: o.k, d: t, t: Date.now(), n: keep };
        delete ASKING[p.i];
        persist(); render();
      });
      outs.appendChild(ob);
    });
    r.appendChild(outs);

    var ta = document.createElement('textarea');
    ta.className = 'note';
    ta.placeholder = 'What they said. Saves as you type.';
    ta.value = (lg && lg.n) || '';
    ta.addEventListener('input', function () {
      if (!LOG[p.i]) LOG[p.i] = { o: '', d: t, t: Date.now(), n: '' };
      LOG[p.i].n = ta.value;
      LOG[p.i].t = Date.now();
      if (!LOG[p.i].d) LOG[p.i].d = t;
      persist();
    });
    r.appendChild(ta);
  }

  var msg = document.createElement('div');
  msg.className = 'msg'; msg.textContent = p.b;
  r.appendChild(msg);

  if (didText || didCall) {
    var u = document.createElement('button');
    u.type = 'button'; u.className = 'undo';
    u.textContent = 'Clear this one';
    u.addEventListener('click', function () {
      delete LOG[p.i]; delete TEXTED[p.i]; delete ASKING[p.i];
      persist(); render();
    });
    r.appendChild(u);
  }
  return r;
}

function renderHistory(box){
  var byId = {};
  everyone().forEach(function (p) { byId[p.i] = p; });
  var rows = [];
  Object.keys(LOG).forEach(function (id) { rows.push({ id: id, e: LOG[id], p: byId[id] }); });
  Object.keys(TEXTED).forEach(function (id) {
    if (!LOG[id]) rows.push({ id: id, e: { o: '', d: TEXTED[id].d, t: TEXTED[id].t, n: '' }, p: byId[id] });
  });
  rows.sort(function (a, b) { return (b.e.t || 0) - (a.e.t || 0); });

  document.getElementById('count').textContent =
    rows.length ? rows.length + (rows.length === 1 ? ' entry' : ' entries') : '';

  if (!rows.length) {
    var e = document.createElement('p');
    e.className = 'empty';
    e.textContent = 'Nothing logged yet. Make a call, write a note, and it lands here.';
    box.appendChild(e);
    return;
  }

  var lastDay = '';
  rows.forEach(function (r) {
    var day = r.e.d || 'undated';
    if (day !== lastDay) {
      var h = document.createElement('div');
      h.className = 'hday';
      h.textContent = (day === today()) ? 'Today' : day;
      box.appendChild(h);
      lastDay = day;
    }
    var d = document.createElement('div');
    d.className = 'hrow';
    var nm = document.createElement('div');
    nm.className = 'nm';
    nm.textContent = r.p ? (r.p.n || r.p.p) : r.id;
    var me = document.createElement('div');
    me.className = 'me';
    var bits = [];
    if (r.e.o) bits.push(outName(r.e.o));
    if (TEXTED[r.id]) bits.push('texted');
    if (r.p) bits.push(r.p.p);
    me.textContent = bits.join('   ');
    d.appendChild(nm); d.appendChild(me);
    if (r.e.n) {
      var n = document.createElement('div');
      n.className = 'hnote';
      n.textContent = r.e.n;
      d.appendChild(n);
    }
    box.appendChild(d);
  });
}

function render(){
  var tabs = [{ id: 'today', t: 'Today' }];
  CAMPS.forEach(function (c) { tabs.push({ id: c.id, t: c.title, n: c.people.length }); });
  tabs.push({ id: 'history', t: 'History' });

  var tb = document.getElementById('tabs');
  tb.textContent = '';
  tabs.forEach(function (x) {
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'chip';
    b.textContent = x.t + (x.n != null ? ' (' + x.n + ')' : '');
    b.setAttribute('aria-pressed', x.id === tab);
    b.addEventListener('click', function () { tab = x.id; shown = LIMIT; render(); });
    tb.appendChild(b);
  });

  var subs = { today: 'Your next ' + TOP_N + ', call backs first', history: 'Everything you have logged' };
  CAMPS.forEach(function (c) { subs[c.id] = c.sub; });
  document.getElementById('sub').textContent =
    (subs[tab] || '') + (STORED ? '' : '   nothing is being remembered on this device');

  tally();
  document.getElementById('find').style.display = (tab === 'history') ? 'none' : '';

  var box = document.getElementById('list');
  box.textContent = '';
  if (tab === 'history') { renderHistory(box); return; }

  var list = visible(), slice = list.slice(0, shown);
  document.getElementById('count').textContent =
    list.length + (list.length === 1 ? ' person' : ' people')
    + (list.length > slice.length ? ', showing ' + slice.length : '');

  if (!list.length) {
    var e = document.createElement('p');
    e.className = 'empty';
    e.textContent = q ? 'Nobody matches that.'
      : (tab === 'today' ? 'Nothing left for today. Good.' : 'Nobody in this list.');
    box.appendChild(e);
    if (tab === 'today') {
      var rf = document.createElement('button');
      rf.type = 'button'; rf.className = 'chip more';
      rf.textContent = 'Pull the next ' + TOP_N;
      rf.addEventListener('click', refreshToday);
      box.appendChild(rf);
    }
    return;
  }

  slice.forEach(function (p) { box.appendChild(card(p)); });

  if (tab === 'today') {
    var done = list.filter(function (p) {
      return (LOG[p.i] && LOG[p.i].d === today()) || (TEXTED[p.i] && TEXTED[p.i].d === today());
    }).length;
    if (done >= list.length) {
      var rf2 = document.createElement('button');
      rf2.type = 'button'; rf2.className = 'chip more';
      rf2.textContent = 'All ' + list.length + ' done. Pull the next ' + TOP_N;
      rf2.addEventListener('click', refreshToday);
      box.appendChild(rf2);
    }
  }

  if (list.length > slice.length) {
    var more = document.createElement('button');
    more.type = 'button'; more.className = 'chip more';
    more.textContent = 'Show ' + Math.min(LIMIT, list.length - slice.length) + ' more';
    more.addEventListener('click', function () { shown += LIMIT; render(); });
    box.appendChild(more);
  }
}

document.getElementById('find').addEventListener('input', function (e) {
  q = e.target.value.trim(); shown = LIMIT; render();
});

function copyOut(text, btn){
  var ok = false;
  try {
    var ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', '');
    ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus(); ta.select(); ta.setSelectionRange(0, text.length);
    ok = document.execCommand('copy');
    document.body.removeChild(ta);
  } catch (e) { ok = false; }
  function win(){
    btn.textContent = 'Copied, paste it to Claude';
    setTimeout(function () { btn.textContent = "Copy today's results"; }, 2400);
  }
  if (ok) { win(); return; }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(win, function () { btn.textContent = 'Could not copy'; });
    return;
  }
  btn.textContent = 'Could not copy';
}

document.getElementById('export').addEventListener('click', function () {
  var t = today(), byId = {};
  everyone().forEach(function (p) { byId[p.i] = p; });
  var lines = ['Work list results ' + t];
  Object.keys(LOG).forEach(function (id) {
    var e = LOG[id];
    if (e.d !== t) return;
    lines.push(id + '  ' + (byId[id] ? byId[id].n : '') + '  ' + (e.o ? outName(e.o) : 'note only')
      + (TEXTED[id] && TEXTED[id].d === t ? ', texted' : '')
      + (e.n ? '  NOTE: ' + e.n.replace(/\n/g, ' ') : ''));
  });
  Object.keys(TEXTED).forEach(function (id) {
    if (TEXTED[id].d !== t || LOG[id]) return;
    lines.push(id + '  ' + (byId[id] ? byId[id].n : '') + '  texted');
  });
  if (lines.length === 1) lines.push('nothing yet today');
  copyOut(lines.join('\n'), this);
});

render();
