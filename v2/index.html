<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-store, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<title>Work list</title>
<!-- build 2026-10-16i -->
<style>
:root{
  --ground:#ECEEF0;--surface:#fff;--surface-2:#F4F5F7;--ink:#17212C;--muted:#5A6572;--line:#D6DBE1;
  --accent:#1F3656;--on-accent:#fff;--brass:#94722F;--brass-soft:#F1E9D8;--good:#2F6B4F;--warn:#9A561A;--hot:#B3261E;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0D131A;--surface:#151D26;--surface-2:#1B2530;--ink:#E6E9ED;--muted:#9AA4B0;--line:#27323E;
  --accent:#A9C1E0;--on-accent:#0D131A;--brass:#D1B173;--brass-soft:#2B2619;--good:#85C9A5;--warn:#E3A66C;--hot:#F2B8B5;}}
*{box-sizing:border-box}
html,body{overflow-x:hidden}
body{margin:0;background:var(--ground);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
     padding:0 16px calc(28px + env(safe-area-inset-bottom,0px));-webkit-font-smoothing:antialiased}
.wrap{max-width:620px;margin:0 auto}
header{padding:18px 0 10px;display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
h1{font-size:22px;margin:0;font-weight:600}
.sub{font-size:12.5px;color:var(--muted)}
.tabs{display:flex;gap:6px;margin:8px 0 14px;overflow-x:auto;padding-bottom:2px}
.tabs button{flex:none;font:inherit;font-size:14px;font-weight:600;border:1px solid var(--line);background:var(--surface-2);
  color:var(--ink);border-radius:999px;padding:8px 15px;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
#plan{display:block;width:100%;text-align:left;font:inherit;font-size:13px;line-height:1.35;
  border:1px solid var(--line);border-left:3px solid var(--accent);background:var(--surface-2);
  color:var(--ink);border-radius:8px;padding:8px 11px;margin:-4px 0 12px}
#plan b{font-weight:600}
#plan .next{color:var(--muted)}
.subs{display:flex;gap:6px;margin:-6px 0 12px;overflow-x:auto;padding-bottom:2px}
.subs button{flex:none;font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface-2);
  color:var(--ink);border-radius:999px;padding:5px 11px}
.subs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.subs .dot{color:var(--accent);font-weight:700}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:8px}
.card.done{opacity:.52}
.work{display:none}
.card.open .work{display:block}
.openbtn{appearance:none;border:0;background:none;color:var(--brass);font:inherit;font-size:12.5px;
  font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:7px 0 0;cursor:pointer}
.card.verified{border-left:3px solid var(--good)}
.chip.ok{color:var(--good);border-color:var(--good)}
.chip.warn{color:var(--warn);border-color:var(--warn)}
a.b.conf,button.b.conf{flex:1 1 100%;font-size:13px;padding:9px}
a.b.txt{flex:1 1 46%;font-size:13px;padding:9px 6px}
a.b.txt.sold{border-color:var(--good);color:var(--good)}
button.b.next{width:100%;margin-top:9px;background:var(--accent);color:var(--on-accent);
  border-color:var(--accent);font-size:15px;padding:12px}
button.b.conf.on{background:var(--brass-soft);border-color:var(--good);color:var(--ink)}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.nm{font-size:16px;font-weight:600;line-height:1.2}
.ad{font-size:12.5px;color:var(--muted);margin-top:1px}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.chip{font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:5px;
  border:1px solid var(--line);color:var(--muted);background:var(--surface-2);line-height:1.5}
.chip.hot{color:var(--on-accent);background:var(--hot);border-color:var(--hot)}
.chip.warm{color:var(--ink);background:var(--brass-soft);border-color:var(--brass)}
.chip.why{color:var(--brass);border-color:var(--brass);background:transparent}
.chip.addr{text-transform:none;letter-spacing:0;font-weight:500;font-size:12px;
  padding:4px 8px;line-height:1.3;flex:1 1 100%}
.chip.addr.sold{color:var(--good);border-color:var(--good)}
.score{font-variant-numeric:tabular-nums;font-size:12px;color:var(--muted);flex:none}
.note{font-size:12.5px;color:var(--muted);margin-top:7px;white-space:pre-wrap;word-break:break-word;line-height:1.35}
.note.clip{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#update{display:block;width:calc(100% - 28px);margin:10px 14px 0;padding:12px;border:0;
  border-radius:10px;background:var(--brass);color:#1a1205;font:inherit;font-size:14px;
  font-weight:700;cursor:pointer}
.counted{font-size:12px;color:var(--brass);padding:2px 0 4px;font-weight:600}
.outs button[data-spoke]{border-left:3px solid var(--brass)}
.chip.warn{background:#5a2a12;border-color:#a8621f;color:#ffd9ad}
.search{padding:10px 14px 0;display:flex;gap:8px;align-items:center}
.search input{flex:1;min-width:0;font:inherit;font-size:16px;padding:10px 12px;border-radius:10px;
  border:1px solid var(--line);background:var(--card);color:inherit;-webkit-appearance:none}
.search input:focus{outline:none;border-color:var(--brass)}
.search button{font:inherit;font-size:13px;font-weight:600;padding:10px 12px;border-radius:10px;
  border:1px solid var(--line);background:var(--card);color:inherit;cursor:pointer}
.more{font-size:12.5px;color:var(--brass);background:none;border:0;padding:4px 0;cursor:pointer;font-weight:600}
.btns{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
a.b,button.b{flex:1 1 0;min-width:96px;text-align:center;text-decoration:none;font:inherit;font-size:14px;font-weight:600;
  border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:10px;padding:10px 8px;cursor:pointer}
a.b.call{background:var(--accent);color:var(--on-accent);border-color:var(--accent);
  flex:1 1 100%;white-space:nowrap;font-size:15px}
a.b.call.off{background:var(--surface-2);color:var(--warn);border-color:var(--warn);cursor:default}
.outs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;margin-top:9px}
.outs button{font:inherit;font-size:12.5px;font-weight:600;border:1px solid var(--line);background:var(--surface-2);
  color:var(--ink);border-radius:9px;padding:9px 4px;cursor:pointer;line-height:1.2}
.outs button.on{background:var(--brass);border-color:var(--brass);color:#fff}
.outs button.good{border-color:var(--good);color:var(--good)}
.outs button.good.on{background:var(--good);border-color:var(--good);color:#fff}
textarea{font:inherit;font-size:14px;width:100%;margin-top:8px;background:var(--surface-2);color:var(--ink);
  border:1px solid var(--line);border-radius:10px;padding:9px;min-height:54px;resize:vertical}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;font-size:12.5px;color:var(--muted)}
.tally{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-bottom:10px}
.tally div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 6px;text-align:center}
.tally b{display:block;font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.tally span{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
.tally div.hit b{color:var(--good)}
.bar button{font:inherit;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--surface-2);
  color:var(--ink);border-radius:9px;padding:7px 12px;cursor:pointer}
.msg{font-size:14px;color:var(--muted);padding:26px 0;text-align:center}
.err{color:var(--warn)}
.ev{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:12px 0;border-top:1px solid var(--line)}
.evbtn{width:100%;text-align:left;font:inherit;color:inherit;background:none;border-left:0;border-right:0;border-bottom:0;cursor:pointer}
.evbtn:active{background:var(--surface-2)}
.go{grid-column:1/3;justify-self:start;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--brass);margin-top:4px}
.chip.back{cursor:pointer;background:var(--surface-2);color:var(--ink);text-transform:none;letter-spacing:0;font-size:13px;padding:7px 12px;align-self:flex-start}
.ev:first-child{border-top:0}
.ev b{font-weight:600}
.ev .p{font-variant-numeric:tabular-nums;font-weight:600}
.ev .d{font-size:12.5px;color:var(--muted);grid-column:1/3}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>Work list</h1><div class="sub" id="sub">Loading</div></div>
    <div class="sub" id="sync"></div>
  </header>

  <button type="button" id="update" hidden>A newer version is ready. Tap to load it.</button>

  <div class="search">
    <input id="q" type="search" inputmode="search" autocomplete="off"
           placeholder="Search a name, number or street" aria-label="Search every contact">
    <button type="button" id="qclear" hidden>Clear</button>
  </div>

  <div class="tabs" id="tabs">
    <button type="button" data-tab="today" aria-selected="true">Today</button>
    <button type="button" data-tab="sold" aria-selected="false">Just sold</button>
    <button type="button" data-tab="listed" aria-selected="false">Just listed</button>
    <button type="button" data-tab="cold" aria-selected="false">Confirm data</button>
  </div>

  <button type="button" id="plan" hidden></button>

  <div class="subs" id="subs" hidden></div>

  <div class="tally" id="tally" hidden></div>
  <div class="bar" id="bar" hidden>
    <span id="count"></span>
    <span><button type="button" id="more">Show more</button>
    <button type="button" id="reload">Refresh</button></span>
  </div>

  <div id="list"></div>
</div>

<script>
/* ------------------------------------------------------------------ config */
// Bumped with every publish. The page compares this against whatever the server
// is actually serving, because a phone will happily run a cached copy for days
// and he has no way of knowing. This is what stops that.
var BUILD = '2026-10-16i';

var API   = 'https://zvrtauvwyztlhjacticg.supabase.co/functions/v1/worklist';
var TOKEN = 'f3f005d6-105b-4b64-8143-27eb5f4c6445';
var NL = String.fromCharCode(10);

/* The token is the only gate, and the page is public, so the endpoint is
   built to hand out nothing but the queue. It cannot read the contact table,
   cannot delete, cannot do anything but append call outcomes.               */

/* ------------------------------------------------------------------ state */
var QUEUE = [], EVENTS = [], TOTAL = 0, tab = 'today', limit = 40, loading = false;
// Two lists, two jobs. Today is people whose details he has verified, so the
// call is a real conversation. Cold is raw Pricefinder data where the only job
// is finding out whether the name and number are even right. The cold list is
// fetched the first time he opens that tab, never on startup.
var COLD = [], COLD_TOTAL = 0, coldLimit = 40, coldLoading = false;
// He works one suburb for a day or two, so the chosen suburb is remembered
// across reloads. Empty string means every suburb at once.
var COLD_SUBS = [], coldSub = '';
// The three suburbs he is working. They lead the row and keep their order.
var FOCUS = ['Wattle Grove', 'Moorebank', 'Chipping Norton'];
var FOUND = null, qTimer = null, qSeq = 0;   // FOUND null means not searching
var PROP = null, PROP_PEOPLE = [], propLoading = false;   // the property he has opened
var KD = 'wl2done', KQ = 'wl2pending', KC = 'wl2conf', KL = 'wl2list', KP = 'wl2pos', KT = 'wl2sms', KX = 'wl2dial';
var KLC = 'wl2coldlist', KCS = 'wl2coldsub';
try { coldSub = localStorage.getItem(KCS) || ''; } catch (e) {}
var DONE = {}, PENDING = [], CONF = {}, SMS = {}, DIAL = {};
try { DONE = JSON.parse(localStorage.getItem(KD) || '{}') || {}; } catch (e) {}
try { SMS  = JSON.parse(localStorage.getItem(KT) || '{}') || {}; } catch (e) {}
try { DIAL = JSON.parse(localStorage.getItem(KX) || '{}') || {}; } catch (e) {}
try { PENDING = JSON.parse(localStorage.getItem(KQ) || '[]') || []; } catch (e) {}
try { CONF = JSON.parse(localStorage.getItem(KC) || '{}') || {}; } catch (e) {}

// The day's list is kept as it was. Coming back from Messages, or from ten
// minutes doing something else, must not reshuffle the forty people he is
// halfway through. Only the Refresh button asks for a new order.
function cacheList(){
  try {
    localStorage.setItem(KL, JSON.stringify({
      day: today(), build: BUILD, total: TOTAL, queue: QUEUE, events: EVENTS }));
  } catch (e) {}
}
function cacheCold(){
  try {
    localStorage.setItem(KLC, JSON.stringify({
      day: today(), build: BUILD, sub: coldSub,
      total: COLD_TOTAL, queue: COLD, subs: COLD_SUBS }));
  } catch (e) {}
}
function readColdCache(){
  try {
    var c = JSON.parse(localStorage.getItem(KLC) || 'null');
    // a cache for a different suburb is no use, it would show the wrong list
    if (c && c.day === today() && c.build === BUILD
        && c.sub === coldSub && c.queue && c.queue.length) return c;
  } catch (e) {}
  return null;
}
function readCache(){
  try {
    var c = JSON.parse(localStorage.getItem(KL) || 'null');
    if (c && c.day === today() && c.build === BUILD && c.queue && c.queue.length) return c;
  } catch (e) {}
  return null;
}
function rememberPos(){
  try { localStorage.setItem(KP, JSON.stringify({ day: today(), y: window.scrollY, id: LAST_ID })); } catch (e) {}
}
function restorePos(){
  var p = null;
  try { p = JSON.parse(localStorage.getItem(KP) || 'null'); } catch (e) {}
  if (!p || p.day !== today()) return;
  if (p.id){
    var card = document.querySelector('[data-cid="' + p.id + '"]');
    if (card){ card.scrollIntoView({ block: 'center' }); return; }
  }
  if (p.y) window.scrollTo(0, p.y);
}
var LAST_ID = null;

function save(){
  try {
    localStorage.setItem(KD, JSON.stringify(DONE));
    localStorage.setItem(KQ, JSON.stringify(PENDING));
    localStorage.setItem(KC, JSON.stringify(CONF));
  } catch (e) {}
}
function today(){
  var d = new Date();
  return d.getFullYear() + '-' + ('0' + (d.getMonth()+1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
}
function $(s){ return document.querySelector(s); }

/* yesterday's ticks are not today's work */
(function prune(){
  var t = today(), changed = false;
  Object.keys(DONE).forEach(function (k){ if (DONE[k].day !== t) { delete DONE[k]; changed = true; } });
  var sc = false;
  Object.keys(SMS).forEach(function (k){ if (SMS[k].day !== t) { delete SMS[k]; sc = true; } });
  if (sc) { try { localStorage.setItem(KT, JSON.stringify(SMS)); } catch (e) {} }
  var dc = false;
  Object.keys(DIAL).forEach(function (k){ if (DIAL[k] !== t) { delete DIAL[k]; dc = true; } });
  if (dc) { try { localStorage.setItem(KX, JSON.stringify(DIAL)); } catch (e) {} }
  if (changed) save();
})();

/* ------------------------------------------------------------------ people */
function first(c){ return (c.first_name || '').split(' ')[0] || 'there'; }
// If the voicemail named a different person we do not actually know who owns
// this number, so no message goes out with a name on it. Thomas got caught by
// this on 13 Oct: the note said Kiran Murphy and the text still said Gerard.
function nameOk(c){ return !c.name_doubt; }
function salute(c, word){
  var n = nameOk(c) ? titled(first(c)) : '';
  return n ? word + ' ' + n + ',' : word + ',';
}
function titled(s){
  return (s || '').toLowerCase().replace(/\b[a-z]/g, function (m){ return m.toUpperCase(); });
}
function fullName(c){
  var n = titled(((c.first_name || '') + ' ' + (c.last_name || '')).trim());
  return n || 'No name';
}
function address(c){
  return titled(((c.street_number || '') + ' ' + (c.street || '')).trim()) + (c.suburb ? ', ' + c.suburb : '');
}
function money(v){
  return v ? '$' + Number(v).toLocaleString('en-AU') : '';
}
function shortDate(d){
  if (!d) return '';
  var p = d.split('-'), dt = new Date(+p[0], +p[1]-1, +p[2]);
  return dt.getDate() + ' ' + ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][dt.getMonth()];
}

/* ------------------------------------------------------------------ messages
   Thomas's own wording. Do not reword these. No dashes anywhere.            */
// 16 Oct 2026. The old version of this told everyone there had been "a bit of
// traction around the corner from you", whether or not there had been. Four
// people asked to be taken off the list in one morning and all four were
// Moorebank, where we track no sales at all. They were being told about activity
// that did not exist, so it read as a blast and they treated it as one.
//
// Now there are two. With a real sale nearby it names it, names their street,
// and asks a question they can answer in three words. With nothing nearby it
// makes no claim about the market whatsoever.
function missedMsg(c){
  if (!c.sold_addr) return missedPlainMsg(c);
  var street = titled(c.street || 'your street');
  return salute(c, 'Hey') + NL
       + 'I tried to give you a call.' + NL + NL
       + 'A place around the corner from you just sold. I have a few buyers who missed '
       + 'out on it and still want this pocket. One of them asked about ' + street
       + ' by name.' + NL + NL
       + 'They are trying to get closer to family.' + NL + NL
       + 'Have you had any thoughts about selling down the track? Or do you know anyone '
       + 'on the street who might be?' + NL + NL
       + 'Thomas, Ausrealty';
}
// Same story as the version above, minus the sale, for suburbs where no sold or
// listed property is tracked yet. The buyer is the reason for the call either
// way, so nothing here depends on having market data.
function missedPlainMsg(c){
  var street = titled(c.street || 'your street');
  return salute(c, 'Hey') + NL
       + 'I tried to give you a call.' + NL + NL
       + 'I have a few buyers at the moment who have asked about ' + street
       + ' by name. They are trying to get closer to family.' + NL + NL
       + 'Have you had any thoughts about selling down the track? Or do you know anyone '
       + 'on the street who might be?' + NL + NL
       + 'Thomas, Ausrealty';
}
function thanksMsg(c){
  return salute(c, 'Hi') + NL
       + 'Appreciate your time on the phone.' + NL + NL
       + 'Let me know if I can be of any further help to you, or to family and friends.' + NL + NL
       + 'Warm regards' + NL
       + 'Thomas Benyamin, Ausrealty';
}
// When he rings off the back of a specific sale, the text names that sale.
function propMsg(c, e){
  var addr = titled(((e.street_number || '') + ' ' + (e.street || '')).trim());
  var d = detailOf(e);
  var sold = isSold(e);
  if (sold){
    // Under offer means a guide, not a sale price. Never quote a guide as what it sold for.
    if (isGuide(e.status)){
      return salute(c, 'Hi') + ' ' + addr + ' is under offer'
           + (d ? '. ' + d : '')
           + guideText(e.price, e.price_high)
           + '. It is one of the closest homes to yours to sell, so I thought you would want to know. '
           + 'Nothing needed from you. Thomas, Ausrealty.';
    }
    return salute(c, 'Hi') + ' ' + addr + ' just sold'
         + (e.price ? ' for ' + money(e.price) : '')
         + (d ? '. ' + d : '')
         + '. It is one of the closest homes to yours to sell recently, so I thought you would want to know. '
         + 'Nothing needed from you. Thomas, Ausrealty.';
  }
  return salute(c, 'Hi') + ' ' + addr + ' has just come on the market'
       + (d ? '. ' + d : '')
       + (e.price ? '. Guiding ' + money(e.price) + (e.price_high ? ' to ' + money(e.price_high) : '') : '')
       + '. It is one of the closest homes to yours to come up, so worth watching what it sells for. '
       + 'Thomas, Ausrealty.';
}

// Keeps the note in his shape: TB- <what happened> <today>. Anything new
// goes in the middle, never duplicated, so tapping a text button twice does
// not write it twice.
function noteAdd(box, phrase){
  var d = dmy();
  var mid = (box.value || '')
      .replace(/^TB-\s*/i, '')
      .replace(new RegExp('\s*' + d.replace(/\//g, '\/') + '\s*$'), '')
      .trim();
  if (phrase && mid.toLowerCase().indexOf(phrase.toLowerCase()) < 0){
    // a specific "texted re 14 Wimbledon" replaces a bare "texted"
    if (/^texted re /i.test(phrase)) mid = mid.replace(/(^|,\s*)texted(?=,|$)/i, '').replace(/^,\s*/, '').trim();
    mid = mid ? mid + ', ' + phrase : phrase;
  }
  box.value = ('TB- ' + mid + ' ' + d).replace(/\s{2,}/g, ' ');
}

function dmy(){
  var d = new Date();
  return d.getDate() + '/' + (d.getMonth()+1) + '/' + d.getFullYear();
}

// The sale nearest this contact, straight off their own card.
// A property marked under offer carries a price GUIDE, not a sale price.
// Saying it sold for the guide would be telling people a number that is not real.
// Shows the Read all button only when the note is actually cut off. A note has
// no height until its card is on the page, so this runs as one pass after the
// whole list is rendered, never per card while it is still detached.
function syncNoteButtons(){
  var notes = document.querySelectorAll('.note.clip');
  for (var i = 0; i < notes.length; i++){
    var n = notes[i];
    var btn = n.nextElementSibling;
    if (!btn || btn.className !== 'more') continue;
    btn.hidden = n.scrollHeight <= n.clientHeight + 2;
  }
}
function isSold(e){
  if (!e) return false;
  if (String(e.event_type || '').toLowerCase().indexOf('sold') >= 0) return true;
  var st = String(e.status || '').toLowerCase();
  return st === 'sold' || st === 'under offer' || st === 'under contract';
}
function isGuide(st){
  st = String(st || '').toLowerCase();
  return st === 'under offer' || st === 'under contract';
}
function guideText(lo, hi){
  if (!lo) return '';
  return '. It was guiding ' + money(lo) + (hi ? ' to ' + money(hi) : '');
}
function soldNearMsg(c){
  if (c.sold_price_is_guide || isGuide(c.sold_status)){
    return salute(c, 'Hi') + ' ' + titled(c.sold_addr) + ' is under offer'
         + (c.sold_detail ? '. ' + c.sold_detail : '')
         + guideText(c.sold_price, c.sold_price_high)
         + '. It is one of the closest homes to yours to sell, so I thought you would want to know. '
         + 'Nothing needed from you. Thomas, Ausrealty.';
  }
  return salute(c, 'Hi') + ' ' + titled(c.sold_addr) + ' just sold'
       + (c.sold_price ? ' for ' + money(c.sold_price) : '')
       + (c.sold_detail ? '. ' + c.sold_detail : '')
       + '. It is one of the closest homes to yours to sell recently, so I thought you would want to know. '
       + 'Nothing needed from you. Thomas, Ausrealty.';
}

// The listing nearest this contact. This is the one he promised Paul Royston.
function listedNearMsg(c){
  var px = c.listed_price
    ? '. Guiding ' + money(c.listed_price) + (c.listed_price_high ? ' to ' + money(c.listed_price_high) : '')
    : '';
  return salute(c, 'Hi') + ' ' + titled(c.listed_addr) + ' has just come on the market'
       + (c.listed_detail ? '. ' + c.listed_detail : '') + px
       + '. It is one of the closest homes to yours to come up, so worth watching what it sells for. '
       + 'Thomas, Ausrealty.';
}

function smsHref(phone, body){
  var n = (phone || '').replace(/[^\d+]/g, '');
  var sep = /iPhone|iPad|Macintosh/i.test(navigator.userAgent) ? '&' : '?';
  return 'sms:' + n + sep + 'body=' + encodeURIComponent(body);
}

/* ------------------------------------------------------------------ outcomes */
// Every one of these is a conversation, so every one counts toward connects.
// Not interested is still someone who picked up and talked to him.
var SPOKE = { spoke: 1, callback: 1, notint: 1, booked: 1 };

var OUTS = [
  { k: 'noanswer', t: 'No answer' },
  // A good conversation that is not a callback, a refusal or a booking.
  // Without this he had no honest way to log having spoken to someone.
  { k: 'spoke',    t: 'Spoke to them', cls: ' good' },
  { k: 'callback', t: 'Call back' },
  { k: 'notint',   t: 'Not interested' },
  { k: 'booked',   t: 'Appraisal booked', cls: ' good' },
  // Either the number or the address is not theirs. One button, because to
  // him it is the same thing: this record is not the person he reached.
  { k: 'wrong',    t: 'Wrong contact' }
];

// Tap the outcome FIRST, then write. The card holds still, the box gets the
// scaffold with the cursor in the gap, and what he types keeps saving. The
// old behaviour saved on the tap and moved the card, which lost the note.
function logOutcome(c, out, box, el){
  LAST_ID = c.id; rememberPos();
  DONE[c.id] = { day: today(), out: out.k, label: out.t, note: '', sent: false };
  noteAdd(box, null);                 // make sure it is TB- ... <date>
  DONE[c.id].note = composeNote(c, box.value);
  box.value = DONE[c.id].note;        // show him exactly what is saved
  save();
  // mark the tapped button without redrawing, so his cursor stays put
  if (el){
    Array.prototype.forEach.call(el.querySelectorAll('.outs button'), function (b){
      b.classList.toggle('on', b.dataset.k === out.k);
    });
  }
  if (el){
    var nb = el.querySelector('.next');
    if (nb) nb.hidden = false;
    var say = el.querySelector('.counted');
    if (say){
      say.textContent = SPOKE[out.k]
        ? 'Counted as a connect'
        : (out.k === 'wrong' ? 'Not a connect. Taken off the list, data marked wrong.'
                             : 'Not a connect');
      say.hidden = false;
    }
  }
  try {
    box.focus();
    var at = box.value.length - dmy().length - 1;   // just before the date
    box.setSelectionRange(at, at);
  } catch (e) {}
  // the whole point of the scoreboard is seeing it move as he works
  renderTally();
  schedulePush();
}

// His format: TB- <outcome>, <what was said> <date>
function composeNote(c, raw){
  var d = dmy(), done = DONE[c.id];
  var said = (raw || '')
      .replace(/^TB-\s*/i, '')
      .replace(new RegExp('\s*' + d.replace(/\//g, '\/') + '\s*$'), '')
      .trim();
  // strip ANY outcome label off the front, not just the current one, so
  // changing his mind does not leave the old one sitting in the text
  for (var i = 0; i < OUTS.length; i++){
    var L = OUTS[i].t;
    if (said.toLowerCase().indexOf(L.toLowerCase()) === 0){
      said = said.slice(L.length).replace(/^,\s*/, '').trim();
      i = -1;   // start again in case two got stacked up
    }
  }
  if (done && done.label){
    return ('TB- ' + done.label + (said ? ', ' + said : '') + ' ' + d).replace(/\s{2,}/g, ' ');
  }
  return ('TB- ' + said + ' ' + d).replace(/\s{2,}/g, ' ');
}

// Nothing is sent while he is still typing. Eight seconds after he stops, or
// the moment he leaves the page, whichever comes first.
var pushTimer = null;
function schedulePush(){
  clearTimeout(pushTimer);
  pushTimer = setTimeout(commitDone, 8000);
  syncTag();
}
// Tapping a text button is the only moment we know a text was composed. The
// phone never tells us whether it was actually sent, so this counts people he
// opened a message to, once each per day.
// Tapping Call counts him as having dialled, straight away. It is kept on this
// phone only and never sent as its own row: the outcome he logs afterwards is
// the real record, and a row with no outcome would reschedule the person.
function markDialled(id){
  var t = today();
  if (DIAL[id] === t) return;
  DIAL[id] = t;
  try { localStorage.setItem(KX, JSON.stringify(DIAL)); } catch (e) {}
  renderTally();
}

function markTexted(id){
  var t = today();
  if (SMS[id] && SMS[id].day === t) return;
  SMS[id] = { day: t, sent: false };
  try { localStorage.setItem(KT, JSON.stringify(SMS)); } catch (e) {}
  renderTally();
  schedulePush();
}

function commitDone(){
  clearTimeout(pushTimer);
  var any = false;
  Object.keys(DONE).forEach(function (id){
    var d = DONE[id];
    if (d.sent || !d.label) return;
    PENDING.push({ contact_id: id, outcome: d.label, note: d.note, at: new Date().toISOString() });
    d.sent = true; any = true;
  });
  var t = today();
  Object.keys(SMS).forEach(function (id){
    var m = SMS[id];
    if (m.sent || m.day !== t) return;
    PENDING.push({ contact_id: id, type: 'sms', outcome: 'Texted', note: '', at: new Date().toISOString() });
    m.sent = true; any = true;
  });
  if (any){ save(); try { localStorage.setItem(KT, JSON.stringify(SMS)); } catch (e) {} }
  push();
}
window.addEventListener('pagehide', function (){ commitDone(); rememberPos(); });
var posTimer = null;
window.addEventListener('scroll', function (){
  clearTimeout(posTimer); posTimer = setTimeout(rememberPos, 400);
}, { passive: true });
document.addEventListener('visibilitychange', function (){
  if (document.visibilityState === 'hidden'){ commitDone(); rememberPos(); }
});

/* ------------------------------------------------------------------ network */
function push(){
  var toConfirm = Object.keys(CONF).filter(function (k){ return !CONF[k].sent; });
  if ((!PENDING.length && !toConfirm.length) || !navigator.onLine) { syncTag(); return; }
  var batch = PENDING.slice(0, 100);
  var confBatch = toConfirm.slice(0, 100).map(function (k){ return { id: k, on: CONF[k].on }; });
  syncTag();
  fetch(API + '?t=' + encodeURIComponent(TOKEN), {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ rows: batch, confirm: confBatch })
  }).then(function (r){ return r.ok ? r.json() : Promise.reject(r.status); })
    .then(function (res){
      if (res && res.today){ SERVER = res.today; }
      PENDING = PENDING.slice(batch.length);
      confBatch.forEach(function (c){ if (CONF[c.id]) CONF[c.id].sent = true; });
      save(); syncTag();
      if (PENDING.length) push();
    }, function (){ syncTag(); });
}
function syncTag(){
  var n = PENDING.length
        + Object.keys(CONF).filter(function (k){ return !CONF[k].sent; }).length
        + Object.keys(DONE).filter(function (k){ return DONE[k].label && !DONE[k].sent; }).length;
  $('#sync').textContent = n ? n + ' to send' : (navigator.onLine ? '' : 'Offline');
}
window.addEventListener('online', push);
setInterval(push, 60000);

/* ------------------------------------------------------------------ search
   He needs this most when someone rings him back, because a person ringing
   back is never in today's list. So this hits every contact on the server,
   not the forty already loaded.                                            */
function runSearch(text){
  text = (text || '').trim();
  $('#qclear').hidden = !text;

  if (text.length < 2){
    if (FOUND !== null){ FOUND = null; render(); setTimeout(restorePos, 60); }
    return;
  }

  var mine = ++qSeq;
  $('#sub').textContent = 'Searching';
  fetch(API + '?t=' + encodeURIComponent(TOKEN) + '&q=' + encodeURIComponent(text))
    .then(function (r){ return r.ok ? r.json() : Promise.reject(r.status); })
    .then(function (d){
      if (mine !== qSeq) return;          // a later keystroke already won
      FOUND = d.results || [];
      render();
    })
    .catch(function (){
      if (mine !== qSeq) return;
      FOUND = [];
      render();
      $('#sub').textContent = 'Could not search. Check your signal.';
    });
}

$('#q').addEventListener('input', function (){
  var v = this.value;
  clearTimeout(qTimer);
  qTimer = setTimeout(function (){ runSearch(v); }, 250);
});
$('#q').addEventListener('keydown', function (e){
  if (e.key === 'Enter'){ e.preventDefault(); clearTimeout(qTimer); runSearch(this.value); this.blur(); }
});
$('#qclear').addEventListener('click', function (){
  $('#q').value = '';
  clearTimeout(qTimer);
  runSearch('');
  $('#q').focus();
});

function load(force){
  if (!force){
    var c = readCache();
    if (c){
      QUEUE = c.queue; TOTAL = c.total; EVENTS = c.events || [];
      render();
      setTimeout(restorePos, 60);
      return;
    }
  }
  if (loading) return;
  loading = true;
  $('#sub').textContent = 'Loading';
  var q = fetch(API + '?t=' + encodeURIComponent(TOKEN) + '&tier=confirmed&limit=' + limit)
            .then(function (r){ return r.ok ? r.json() : Promise.reject(r.status); });
  var e = fetch(API + '?t=' + encodeURIComponent(TOKEN) + '&events=1')
            .then(function (r){ return r.ok ? r.json() : Promise.reject(r.status); })
            .catch(function (){ return { events: [] }; });
  Promise.all([q, e]).then(function (res){
    load.retried = false;
    QUEUE = res[0].queue || []; TOTAL = res[0].total || QUEUE.length;
    if (typeof res[0].cold_total === 'number') COLD_TOTAL = res[0].cold_total;
    EVENTS = res[1].events || [];
    tabCounts();
    loading = false;
    cacheList();
    render();
    setTimeout(restorePos, 60);
  }, function (status){
    loading = false;
    // One silent retry. A redeploy or a cold start fails for a few seconds and
    // that is not worth a frightening message.
    if (!load.retried){
      load.retried = true;
      setTimeout(load, 2500);
      $('#sub').textContent = 'Retrying';
      return;
    }
    load.retried = false;
    $('#list').textContent = '';
    var p = document.createElement('p');
    p.className = 'msg err';
    p.textContent = status === 401
      ? 'The list refused this page twice. Tell Claude, the token may have been rotated.'
      : 'Could not reach the list. Check your signal and tap Refresh.';
    $('#list').appendChild(p);
    $('#sub').textContent = 'Not loaded';
  });
}

// The cold list. Ordered by whether there is a reason to ring that street
// today, which lands everyone on the same street together, in number order.
function loadCold(force){
  if (!force){
    var c = readColdCache();
    if (c){
      COLD = c.queue; COLD_TOTAL = c.total || COLD.length;
      if (c.subs && c.subs.length) COLD_SUBS = c.subs;
      renderSubs(); render(); return;
    }
  }
  if (coldLoading) return;
  coldLoading = true;
  $('#sub').textContent = 'Loading the cold list';
  fetch(API + '?t=' + encodeURIComponent(TOKEN) + '&tier=cold&limit=' + coldLimit
        + (coldSub ? '&suburb=' + encodeURIComponent(coldSub) : ''))
    .then(function (r){ return r.ok ? r.json() : Promise.reject(r.status); })
    .then(function (d){
      coldLoading = false;
      COLD = d.queue || [];
      COLD_TOTAL = typeof d.total === 'number' ? d.total : COLD.length;
      if (d.suburbs) COLD_SUBS = d.suburbs;
      cacheCold();
      tabCounts();
      renderSubs();
      render();
    }, function (){
      coldLoading = false;
      if (tab !== 'cold') return;
      $('#list').textContent = '';
      var p = document.createElement('p');
      p.className = 'msg err';
      p.textContent = 'Could not load the cold list. Tap Refresh.';
      $('#list').appendChild(p);
      $('#sub').textContent = 'Not loaded';
    });
}

/* ------------------------------------------------------------------- day */
/* His day, in his own words. 9 to 10 the top 40 across every suburb. 10 to 11
   just sold and just listed, the ones who will convert or want keeping posted.
   11 to 12 and 1 to 2 confirming data, one suburb at a time, stretching to 3 if
   it is going well. 3 pm he is out the door knocking.

   This is a prompt, never a lock. Every tab stays tappable all day.           */
var DAY = [
  { from: 0,    to: 9,    tab: 'today',  what: 'Top 40 at 9' },
  { from: 9,    to: 10,   tab: 'today',  what: 'Top 40, every suburb' },
  { from: 10,   to: 11,   tab: 'sold',   what: 'Just sold and just listed' },
  { from: 11,   to: 12,   tab: 'cold',   what: 'Confirm data' },
  { from: 12,   to: 13,   tab: null,     what: 'Break' },
  { from: 13,   to: 15,   tab: 'cold',   what: 'Confirm data' },
  { from: 15,   to: 24,   tab: null,     what: 'Out the door, door knocking' }
];

function dayBlock(){
  var h = new Date().getHours() + new Date().getMinutes() / 60;
  for (var i = 0; i < DAY.length; i++){
    if (h >= DAY[i].from && h < DAY[i].to) return DAY[i];
  }
  return DAY[DAY.length - 1];
}

function renderPlan(){
  var box = $('#plan');
  if (!box) return;
  // the plan is about the day's shape, it has no place over a search result
  if (FOUND !== null || PROP){ box.hidden = true; return; }

  var b = dayBlock();
  var now = new Date();
  var h = now.getHours() + now.getMinutes() / 60;
  box.hidden = false;
  box.textContent = '';

  var lead = document.createElement('b');
  if (h < 9) lead.textContent = 'Starts at 9. ' + b.what;
  else if (!b.tab) lead.textContent = b.what;
  else lead.textContent = 'Now: ' + b.what;
  box.appendChild(lead);

  // what is coming, so the hour does not run away from him
  var nxt = null;
  for (var i = 0; i < DAY.length; i++){
    if (DAY[i].from > h && DAY[i].what !== b.what){ nxt = DAY[i]; break; }
  }
  if (nxt){
    var sp = document.createElement('span');
    sp.className = 'next';
    var at = nxt.from > 12 ? (nxt.from - 12) + ' pm' : nxt.from + ' am';
    sp.textContent = '  then ' + at + ', ' + nxt.what.toLowerCase();
    box.appendChild(sp);
  }

  box.disabled = !b.tab || b.tab === tab;
}

$('#plan').addEventListener('click', function (){
  var b = dayBlock();
  if (!b.tab || b.tab === tab) return;
  var btn = document.querySelector('#tabs button[data-tab="' + b.tab + '"]');
  if (btn) btn.click();
});

// refreshed on the minute, so the hour he is in is always the real one
setInterval(renderPlan, 60000);

// One button per suburb, because a day or two is spent on each. The number is
// how many are left to call there. A dot means at least one person in that
// suburb has a sold or listed property nearby to open with, which is the
// difference between a warm opener and a straight cold call.
function renderSubs(){
  var box = $('#subs');
  if (!box) return;
  var show = tab === 'cold' && FOUND === null && !PROP && COLD_SUBS.length > 0;
  box.hidden = !show;
  if (!show) { box.textContent = ''; return; }

  box.textContent = '';
  var all = COLD_SUBS.reduce(function (n, s){ return n + Number(s.n || 0); }, 0);

  // The three he is actually working sit at the front, in his order, so they
  // behave like three fixed tabs rather than drifting about as counts change.
  var pinned = [];
  FOCUS.forEach(function (name){
    for (var i = 0; i < COLD_SUBS.length; i++){
      if (COLD_SUBS[i].suburb === name){ pinned.push(COLD_SUBS[i]); return; }
    }
  });
  var rest = COLD_SUBS.filter(function (r){ return FOCUS.indexOf(r.suburb) < 0; });

  var rows = pinned
    .concat([{ suburb: '', n: all, with_opener: 0, label: 'All suburbs' }])
    .concat(rest);

  rows.forEach(function (r){
    var b = document.createElement('button');
    b.type = 'button';
    b.dataset.sub = r.suburb;
    b.setAttribute('aria-selected', r.suburb === coldSub ? 'true' : 'false');
    b.textContent = (r.label || r.suburb) + ' ' + Number(r.n || 0).toLocaleString();
    if (Number(r.with_opener || 0) > 0){
      var d = document.createElement('span');
      d.className = 'dot';
      d.textContent = ' \u2022';
      b.appendChild(d);
    }
    b.addEventListener('click', function (){
      if (coldSub === r.suburb) return;
      coldSub = r.suburb;
      try { localStorage.setItem(KCS, coldSub); } catch (e) {}
      COLD = []; coldLimit = 40;
      renderSubs();
      loadCold();
      window.scrollTo(0, 0);
    });
    box.appendChild(b);
  });
}

// Put the real numbers on the two tabs so he can see at a glance how much
// confirmed work is left before he has to fall back to cold calling.
function tabCounts(){
  var t = document.querySelector('#tabs button[data-tab="today"]');
  var c = document.querySelector('#tabs button[data-tab="cold"]');
  if (t) t.textContent = TOTAL ? 'Today (' + TOTAL + ')' : 'Today';
  if (c) c.textContent = COLD_TOTAL ? 'Confirm data (' + COLD_TOTAL.toLocaleString() + ')' : 'Confirm data';
}

/* ------------------------------------------------------------------ render */
/* The importer stamped every note with where the row came from. Useful in the
   database, pure noise on a card you read while the phone is ringing.        */
function cleanNote(s){
  if (!s) return '';
  return s.replace(/From Wattle Grove COLD CALL sheet[^|]*(\||$)/gi, '')
          .replace(/Cold call list, not yet contacted/gi, '')
          .replace(/From the master cold call sheet/gi, '')
          .replace(/\s*\|\s*/g, '  ')
          .replace(/\s{3,}/g, '  ')
          .trim();
}

function bandChip(b){
  var u = (b || '').toUpperCase();
  var s = document.createElement('span');
  s.className = 'chip' + (u === 'HOT' ? ' hot' : u === 'WARM' ? ' warm' : '');
  s.textContent = u === 'NURTURE' ? 'PROSPECT' : (u || 'PROSPECT');
  return s;
}

function personCard(c, ev){
  var el = document.createElement('div');
  var done = DONE[c.id];
  var confd = CONF[c.id] ? CONF[c.id].on : !!c.data_confirmed;
  el.className = 'card' + (done ? ' done' : '') + (confd ? ' verified' : '');
  el.dataset.cid = c.id;

  var top = document.createElement('div');
  top.className = 'top';
  var who = document.createElement('div');
  var nm = document.createElement('div'); nm.className = 'nm'; nm.textContent = fullName(c);
  var ad = document.createElement('div'); ad.className = 'ad'; ad.textContent = address(c);
  who.append(nm, ad);
  var sc = document.createElement('div'); sc.className = 'score'; sc.textContent = c.score;
  top.append(who, sc);
  el.appendChild(top);

  var chips = document.createElement('div');
  chips.className = 'chips';
  chips.appendChild(bandChip(c.band));
  if (c.reason){
    var why = document.createElement('span'); why.className = 'chip why'; why.textContent = c.reason;
    chips.appendChild(why);
  }
  // Every property he can text about gets its own line, with the full
  // description. Rod Lynch had a sale at 0 m and a listing at 490 m, and the
  // card was showing him the far one because it was listed more recently.
  function propChip(kind, addr, price, priceHigh, detail, metres, status){
    if (!addr) return;
    var sold = kind === 'sold';
    // Under offer is counted as sold so it leaves the new listing rotation, but
    // its figure is still only a guide. The chip must not read like a sale price.
    var guide = sold && isGuide(status);
    var txt = (guide ? 'Under offer ' : sold ? 'Sold ' :
               ((status && status !== 'For sale') ? status + ' ' : 'For sale '))
            + titled(addr);
    if (price){
      txt += (sold && !guide) ? ' ' + money(price)
                              : ', guide ' + money(price) + (priceHigh ? ' to ' + money(priceHigh) : '');
    }
    if (detail) txt += '. ' + detail;
    if (metres != null) txt += '. ' + (metres < 30 ? 'same street' : metres + ' m away');
    var s = document.createElement('span');
    s.className = 'chip addr' + (sold ? ' sold' : '');
    s.textContent = txt;
    chips.appendChild(s);
  }

  // nearest first, because a sale on their own street beats a newer one
  // three streets over
  var props = [];
  if (c.name_doubt){
    var nd = document.createElement('span');
    nd.className = 'chip warn';
    nd.textContent = 'Name not confirmed. ' + c.name_doubt;
    chips.appendChild(nd);
  }
  if (c.sold_addr)   props.push({ k:'sold',   m: c.sold_m });
  if (c.listed_addr) props.push({ k:'listed', m: c.listed_m });
  props.sort(function (a, b){ return (a.m == null ? 9999 : a.m) - (b.m == null ? 9999 : b.m); });
  props.forEach(function (x){
    if (x.k === 'sold')
      propChip('sold', c.sold_addr, c.sold_price, c.sold_price_high,
               c.sold_detail, c.sold_m, c.sold_status);
    else
      propChip('listed', c.listed_addr, c.listed_price, c.listed_price_high,
               c.listed_detail, c.listed_m, c.listed_status);
  });
  if (ev && c.metres > 0){
    var dm = document.createElement('span'); dm.className = 'chip';
    dm.textContent = c.metres + ' m away';
    chips.appendChild(dm);
  }
  if (c.consecutive_no_answer > 2){
    var na = document.createElement('span'); na.className = 'chip';
    na.textContent = c.consecutive_no_answer + ' no answers in a row';
    chips.appendChild(na);
  }
  if (confd){
    var vc = document.createElement('span'); vc.className = 'chip ok'; vc.textContent = 'Confirmed';
    chips.appendChild(vc);
  }
  if (c.is_buyer){
    var bu = document.createElement('span'); bu.className = 'chip'; bu.textContent = 'Buyer';
    chips.appendChild(bu);
  }
  if (c.recently_sold){
    var rs = document.createElement('span'); rs.className = 'chip warm'; rs.textContent = 'Sold recently';
    chips.appendChild(rs);
  }
  if (c.sms_only){
    var so = document.createElement('span'); so.className = 'chip warn'; so.textContent = 'Text only';
    chips.appendChild(so);
  }
  if (done){
    var dn = document.createElement('span'); dn.className = 'chip'; dn.textContent = 'Done: ' + done.label;
    chips.appendChild(dn);
  }
  el.appendChild(chips);

  var noteText = cleanNote(c.notes);
  if (noteText){
    var n = document.createElement('div');
    n.className = 'note clip';
    n.textContent = noteText;
    el.appendChild(n);
    // The note box clamps to two lines. A character count cannot tell us
    // whether a note overflows, because a short note can still wrap to three
    // lines and get cut with no way to open it. So measure the real height.
    var mb = document.createElement('button');
    mb.type = 'button'; mb.className = 'more'; mb.textContent = 'Read all';
    mb.hidden = true;
    mb.addEventListener('click', function (){
      var clipped = n.classList.toggle('clip');
      mb.textContent = clipped ? 'Read all' : 'Less';
    });
    el.appendChild(mb);
  }

  var box = document.createElement('textarea');
  box.placeholder = 'What was said';

  var btns = document.createElement('div');
  btns.className = 'btns';
  // Someone who asked not to be phoned does not get a Call button. Texting
  // them is still fine, that is what they asked for.
  var call = document.createElement('a');
  call.className = 'b call' + (c.sms_only ? ' off' : '');
  call.href = c.sms_only ? '#' : 'tel:' + (c.mobile || '').replace(/[^\d+]/g, '');
  call.textContent = c.sms_only ? 'Do not call. Text only' : 'Call ' + (c.mobile || '');
  if (c.sms_only) call.addEventListener('click', function (e){ e.preventDefault(); });
  // Tapping Call lays out the note the way he writes them: TB- then what was
  // said, then today's date. The outcome drops into the gap when he taps one.
  call.addEventListener('click', function (){
    markDialled(c.id);
    if (!box.value.trim()) box.value = 'TB-  ' + dmy();
    setTimeout(function (){
      try { box.focus(); box.setSelectionRange(4, 4); } catch (e) {}
    }, 50);
  });
  btns.appendChild(call);

  function textBtn(label, body, cls, record){
    var a = document.createElement('a');
    a.className = 'b txt' + (cls ? ' ' + cls : '');
    a.href = smsHref(c.mobile, body);
    a.textContent = label;
    // fires before the phone opens Messages, so the note is written either way
    a.addEventListener('click', function (){
      noteAdd(box, record);
      markTexted(c.id);
    });
    btns.appendChild(a);
  }

  if (ev){
    // opened from a property, so that property is the only text that makes sense
    textBtn('Text about this one', propMsg(c, ev), '',
            'texted re ' + titled(((ev.street_number||'') + ' ' + (ev.street||'')).trim()));
  } else {
    var thanks = done && done.out !== 'noanswer';
    textBtn(thanks ? 'Text: thanks for your time' : 'Text: I tried to call',
            thanks ? thanksMsg(c) : missedMsg(c), '',
            'texted');
    var order = [];
    if (c.sold_addr)   order.push({ k:'sold',   m: c.sold_m == null ? 9999 : c.sold_m });
    if (c.listed_addr) order.push({ k:'listed', m: c.listed_m == null ? 9999 : c.listed_m });
    order.sort(function (a, b){ return a.m - b.m; });
    order.forEach(function (x){
      if (x.k === 'sold')
        textBtn('Text: ' + titled(c.sold_addr) + ' sold', soldNearMsg(c), 'sold',
                'texted re ' + titled(c.sold_addr) + ' sold');
      else
        textBtn('Text: ' + titled(c.listed_addr) + ' for sale', listedNearMsg(c), '',
                'texted re ' + titled(c.listed_addr) + ' for sale');
    });
  }
  el.appendChild(btns);

  // Confirm data: he has actually spoken to them, so the name and address are
  // real rather than scraped off a cold call list.
  var isConf = CONF[c.id] ? CONF[c.id].on : !!c.data_confirmed;
  var cf = document.createElement('button');
  cf.type = 'button';
  cf.className = 'b conf' + (isConf ? ' on' : '');
  cf.textContent = isConf ? 'Data confirmed' : 'Confirm data';
  cf.addEventListener('click', function (){
    var now = !(CONF[c.id] ? CONF[c.id].on : !!c.data_confirmed);
    CONF[c.id] = { on: now, sent: false };
    save(); push(); render();
  });

  var work = document.createElement('div');
  work.className = 'work';

  var outs = document.createElement('div');
  outs.className = 'outs';
  if (done) box.value = done.note;
  box.addEventListener('input', function (){
    if (!DONE[c.id]) return;
    DONE[c.id].note = composeNote(c, box.value);
    DONE[c.id].sent = false;
    save(); schedulePush();
  });

  OUTS.forEach(function (o){
    var b = document.createElement('button');
    b.type = 'button';
    b.dataset.k = o.k;
    b.className = (done && done.out === o.k ? 'on' : '') + (o.cls || '');
    b.textContent = o.t;
    if (SPOKE[o.k]) b.dataset.spoke = '1';
    b.addEventListener('click', function (){ logOutcome(c, o, box, el); });
    outs.appendChild(b);
  });
  // Appears the moment an outcome is tapped. Saves whatever he has written
  // and drops the card to the bottom so the next person is in front of him.
  var counted = document.createElement('div');
  counted.className = 'counted';
  counted.hidden = true;
  el.appendChild(counted);

  var nxt = document.createElement('button');
  nxt.type = 'button';
  nxt.className = 'b next';
  nxt.textContent = 'Done, next';
  nxt.hidden = !done;
  nxt.addEventListener('click', function (){
    if (DONE[c.id]) DONE[c.id].note = composeNote(c, box.value);
    save();
    commitDone();
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  work.append(cf, outs, box, nxt);

  // One tap opens the working controls. Anyone already dealt with today opens
  // by default so he can see what he wrote.
  var opener = document.createElement('button');
  opener.type = 'button'; opener.className = 'openbtn';
  opener.textContent = 'Log this call';
  opener.addEventListener('click', function (){
    el.classList.add('open'); opener.hidden = true;
  });
  if (done){ el.classList.add('open'); opener.hidden = true; }

  // calling or texting someone means he is about to need the controls
  [call].concat(Array.prototype.slice.call(btns.querySelectorAll('a.txt')))
    .forEach(function (a){
      a.addEventListener('click', function (){ el.classList.add('open'); opener.hidden = true; });
    });

  el.append(opener, work);
  return el;
}

function detailOf(e){
  var bits = [];
  if (e.beds != null)  bits.push(e.beds + ' bed');
  if (e.baths != null) bits.push(e.baths + ' bath');
  if (e.cars != null)  bits.push(e.cars + ' car');
  var s = bits.join(' ');
  if (e.land_size) s += (s ? ', ' : '') + e.land_size + ' m2';
  if (e.property_type) s += (s ? ', ' : '') + e.property_type;
  return s;
}

function eventRows(kind){
  var box = document.createElement('div');
  box.className = 'card';
  var rows = EVENTS.filter(function (e){ return kind === 'sold' ? isSold(e) : !isSold(e); });
  if (!rows.length){
    var p = document.createElement('p'); p.className = 'msg';
    p.textContent = kind === 'sold' ? 'No sales recorded yet.' : 'Nothing on the market yet.';
    box.appendChild(p);
    return box;
  }
  // Newest first. He wants to be the first agent on the phone when something
  // sells, so a big sale from August must not sit above yesterday's.
  rows.sort(function (a, b){
    var da = a.event_date || a.first_seen || '', db = b.event_date || b.first_seen || '';
    if (da !== db) return da < db ? 1 : -1;
    return (b.reach || 0) - (a.reach || 0);
  });
  rows.forEach(function (e){
    var r = document.createElement('button');
    r.type = 'button'; r.className = 'ev evbtn';
    var a = document.createElement('b');
    a.textContent = titled(((e.street_number || '') + ' ' + (e.street || '')).trim());
    var px = money(e.price);
    if (px && e.price_high) px += ' to ' + money(e.price_high);
    if (!px) px = 'No price shown';
    var p = document.createElement('span'); p.className = 'p'; p.textContent = px;
    var d = document.createElement('span'); d.className = 'd';
    d.textContent = [detailOf(e), e.suburb,
                     e.geo_approx ? 'position approximate' : ''].filter(Boolean).join(' · ');
    var go = document.createElement('span'); go.className = 'go';
    go.textContent = [shortDate(e.event_date), e.status && e.status !== 'For sale' ? e.status : '',
                      (e.reach || 0) + ' to call'].filter(Boolean).join('  ·  ');
    r.append(a, p, d, go);
    r.addEventListener('click', function (){ openProperty(e); });
    box.appendChild(r);
  });
  return box;
}

function openProperty(e){
  if (propLoading) return;
  PROP = e; PROP_PEOPLE = []; propLoading = true;
  render();
  fetch(API + '?t=' + encodeURIComponent(TOKEN) + '&near=' + encodeURIComponent(e.id))
    .then(function (r){ return r.ok ? r.json() : Promise.reject(r.status); })
    .then(function (d){ PROP_PEOPLE = d.people || []; propLoading = false; render(); },
          function (){ propLoading = false; PROP_PEOPLE = null; render(); });
}

function closeProperty(){ PROP = null; PROP_PEOPLE = []; render(); }

function propertyView(){
  var box = document.createElement('div');

  var head = document.createElement('div');
  head.className = 'card';
  var back = document.createElement('button');
  back.type = 'button'; back.className = 'chip back'; back.textContent = 'Back to the list';
  back.addEventListener('click', closeProperty);
  head.appendChild(back);

  var sold = isSold(PROP);
  var h = document.createElement('div'); h.className = 'nm';
  h.textContent = (sold ? 'Sold: ' : 'For sale: ')
    + titled(((PROP.street_number || '') + ' ' + (PROP.street || '')).trim());
  var sub = document.createElement('div'); sub.className = 'ad';
  var px = money(PROP.price);
  if (px && PROP.price_high) px += ' to ' + money(PROP.price_high);
  sub.textContent = [px, detailOf(PROP), PROP.suburb, shortDate(PROP.event_date)]
                      .filter(Boolean).join(' · ');
  head.append(h, sub);

  if (PROP.geo_approx){
    var w = document.createElement('p'); w.className = 'note';
    w.textContent = 'This one is on a long street so the position is a guess. Check the address before you quote a distance.';
    head.appendChild(w);
  }
  box.appendChild(head);

  if (propLoading){
    var l = document.createElement('p'); l.className = 'msg'; l.textContent = 'Finding everyone nearby';
    box.appendChild(l); return box;
  }
  if (PROP_PEOPLE === null){
    var er = document.createElement('p'); er.className = 'msg err';
    er.textContent = 'Could not load the neighbours. Check your signal and tap Back, then try again.';
    box.appendChild(er); return box;
  }

  var todo = PROP_PEOPLE.filter(function (c){ return !DONE[c.id] && !c.called_today; });
  var seen = PROP_PEOPLE.filter(function (c){ return DONE[c.id] || c.called_today; });
  $('#count').textContent = todo.length + ' to call, ' + seen.length + ' done';
  todo.concat(seen).forEach(function (c){ box.appendChild(personCard(c, PROP)); });
  if (!PROP_PEOPLE.length){
    var n = document.createElement('p'); n.className = 'msg';
    n.textContent = 'Nobody within 200 m has a number yet.';
    box.appendChild(n);
  }
  return box;
}

// Today's work, counted off what he has actually tapped.
// His daily targets, from Work targets.md: 50 connects, 2 appraisals booked,
// 8 confirmed. The maths behind $300k GCI.
var TARGET = { spoke: 50, booked: 2, confirmed: 8 };

// The day's totals as the database counts them. This is the honest number: it
// includes calls made off a property, calls made earlier, and calls made on
// another device. SERVER is null until the first fetch lands.
var SERVER = null;

function loadToday(again){
  fetch(API + '?t=' + encodeURIComponent(TOKEN) + '&today=1')
    .then(function (r){ return r.ok ? r.json() : Promise.reject(r.status); })
    .then(function (d){ if (d && d.today){ SERVER = d.today; renderTally(); } })
    .catch(function (){
      // A cold start answers 503 for a second or two. Swallowing that silently
      // left the whole scoreboard sitting on zero for three minutes, which
      // looks exactly like the app not counting his work.
      if (again) return;
      setTimeout(function (){ loadToday(true); }, 2500);
    });
}

function renderTally(){
  var box = $('#tally');
  if (!box) return;
  // Always on. A call made off a just sold or just listed property counts the
  // same as one off today's list, so the scoreboard has to follow him there.
  // It used to hide the moment he opened a property, which made it look like
  // that work did not count.
  // Count what this phone has done but not yet sent, then add it to whatever
  // the database already knows. Anything already sent is in SERVER, so counting
  // only the unsent ones here is what stops it being counted twice.
  var spoke = 0, booked = 0;
  var tnow = today();
  // One person dialled and then logged is one call, not two, so count heads.
  var heads = {};
  Object.keys(DIAL).forEach(function (id){ if (DIAL[id] === tnow) heads[id] = 1; });
  Object.keys(DONE).forEach(function (id){
    var d = DONE[id];
    if (!d.label) return;
    heads[id] = 1;
    if (SERVER && d.sent) return;
    if (SPOKE[d.out]) spoke++;
    if (d.out === 'booked') booked++;
  });
  // anything already on the server is counted there, not here
  if (SERVER) Object.keys(heads).forEach(function (id){
    if (DONE[id] && DONE[id].sent) delete heads[id];
  });
  var called = Object.keys(heads).length;
  var confirmed = Object.keys(CONF).filter(function (k){
    return CONF[k].on && !(SERVER && CONF[k].sent);
  }).length;
  var tday = today();
  var texted = Object.keys(SMS).filter(function (k){
    return SMS[k].day === tday && !(SERVER && SMS[k].sent);
  }).length;

  if (SERVER){
    called    += SERVER.called    || 0;
    spoke     += SERVER.spoke     || 0;
    booked    += SERVER.booked    || 0;
    texted    += SERVER.texted    || 0;
    confirmed += SERVER.confirmed || 0;
  }

  box.hidden = false;
  box.textContent = '';
  [['Called', called, null],
   ['Texts', texted, null],
   ['Spoke to', spoke, TARGET.spoke],
   ['Appraisals', booked, TARGET.booked],
   ['Confirmed', confirmed, TARGET.confirmed]]
    .forEach(function (x){
      var name = x[0], n = x[1], goal = x[2];
      var d = document.createElement('div');
      if (goal && n >= goal) d.className = 'hit';
      var b = document.createElement('b');
      b.textContent = goal ? n + ' / ' + goal : String(n);
      var sp = document.createElement('span'); sp.textContent = name;
      d.append(b, sp); box.appendChild(d);
    });
}

// render has several early exits, so the note pass wraps it rather than
// sitting at the bottom of it where some paths would never reach it.
function render(){
  renderList();
  renderPlan();
  renderSubs();
  syncNoteButtons();
}
function renderList(){
  renderTally();
  var list = $('#list');
  list.textContent = '';
  syncTag();

  // A search takes over the list. Tabs and the day's order are left alone, so
  // clearing the box puts him back exactly where he was.
  if (FOUND !== null){
    $('#bar').hidden = false;
    $('#more').hidden = true;
    $('#count').textContent = FOUND.length === 1 ? '1 match' : FOUND.length + ' matches';
    $('#sub').textContent = 'Searching every contact, not just today';
    if (!FOUND.length){
      var none = document.createElement('p');
      none.className = 'msg';
      none.textContent = 'Nobody matches that.';
      list.appendChild(none);
      return;
    }
    FOUND.forEach(function (c){ list.appendChild(personCard(c)); });
    return;
  }

  if (PROP){
    $('#bar').hidden = false;
    $('#more').hidden = true;
    $('#sub').textContent = 'People near one property';
    list.appendChild(propertyView());
    return;
  }

  if (tab === 'cold'){
    $('#bar').hidden = false;
    var cpend = COLD.filter(function (c){ return !DONE[c.id]; });
    var cdone = COLD.filter(function (c){ return DONE[c.id]; });
    $('#count').textContent = cpend.length + ' to call, ' + cdone.length + ' done';
    $('#more').hidden = COLD.length >= COLD_TOTAL;
    $('#sub').textContent = COLD.length
      ? (coldSub || 'Every suburb') + '. Unverified data, the job is to confirm the name and number'
      : (coldLoading ? 'Loading' : 'Nothing left in ' + (coldSub || 'the cold list'));
    if (!COLD.length){
      var cp = document.createElement('p');
      cp.className = 'msg';
      cp.textContent = coldLoading ? 'Loading.'
        : coldSub ? 'Nothing left to call in ' + coldSub + ' today.'
        : 'Nothing in the cold list.';
      list.appendChild(cp);
      return;
    }
    cpend.concat(cdone).forEach(function (c){ list.appendChild(personCard(c)); });
    return;
  }

  if (tab === 'today'){
    $('#bar').hidden = false;
    // anyone already handled today drops to the bottom, and stays put while you work
    var pending = QUEUE.filter(function (c){ return !DONE[c.id]; });
    var handled = QUEUE.filter(function (c){ return DONE[c.id]; });
    $('#count').textContent = pending.length + ' to call, ' + handled.length + ' done';
    $('#more').hidden = QUEUE.length >= TOTAL;
    $('#sub').textContent = 'Showing ' + QUEUE.length + ' of ' + TOTAL + ', reordered daily';
    if (!QUEUE.length){
      var p = document.createElement('p'); p.className = 'msg'; p.textContent = 'Nothing due today.';
      list.appendChild(p);
      return;
    }
    pending.concat(handled).forEach(function (c){ list.appendChild(personCard(c)); });
  } else {
    $('#bar').hidden = true;
    var covered = {};
    EVENTS.forEach(function (e){ if (e.suburb) covered[e.suburb] = 1; });
    var have = Object.keys(covered).sort();
    var missing = FOCUS.filter(function (n){ return !covered[n]; });
    $('#sub').textContent = EVENTS.length + ' properties tracked'
      + (have.length ? ', ' + have.join(' and ') : '')
      + (missing.length ? '. No data yet for ' + missing.join(' or ')
                        + ', needs a Pricefinder export' : '');
    list.appendChild(eventRows(tab));
  }
}

/* ------------------------------------------------------------------ wiring */
$('#tabs').addEventListener('click', function (ev){
  var b = ev.target.closest('button[data-tab]');
  if (!b) return;
  tab = b.dataset.tab; PROP = null; PROP_PEOPLE = [];
  if (tab === 'cold' && !COLD.length) loadCold();
  // changing tab means he is done searching
  FOUND = null; qSeq++; $('#q').value = ''; $('#qclear').hidden = true;
  Array.prototype.forEach.call(this.querySelectorAll('button'), function (x){
    x.setAttribute('aria-selected', x === b ? 'true' : 'false');
  });
  render();
});
$('#more').addEventListener('click', function (){
  if (tab === 'cold'){ coldLimit = coldLimit >= 200 ? 2000 : coldLimit + 80; loadCold(true); return; }
  limit = limit >= 200 ? 2000 : limit + 80; load(true);
});
$('#reload').addEventListener('click', function (){
  if (tab === 'cold'){ coldLimit = Math.max(coldLimit, COLD.length); loadCold(true); loadToday(); return; }
  limit = Math.max(limit, QUEUE.length); load(true); loadToday();
});

// Does he have work this phone has not sent yet
function hasUnsent(){
  if (PENDING.length) return true;
  var t = today(), un = false;
  Object.keys(DONE).forEach(function (k){ if (DONE[k].label && !DONE[k].sent) un = true; });
  Object.keys(SMS).forEach(function (k){ if (SMS[k].day === t && !SMS[k].sent) un = true; });
  return un;
}

// The token lives in this file, not in the address, so the link stays short
// enough for him to type. Only the version tag is needed, to beat the cache.
function freshUrl(v){
  return location.pathname + '?v=' + encodeURIComponent(v);
}

function checkBuild(){
  fetch(location.pathname + '?cb=' + Date.now(), { cache: 'no-store' })
    .then(function (r){ return r.ok ? r.text() : Promise.reject(r.status); })
    .then(function (html){
      var m = html.match(/<!-- build ([^>]*?) -->/);
      if (!m) return;
      var live = m[1].trim();
      if (live === BUILD) { $('#update').hidden = true; return; }

      // never throw away work. Send it first, and pick this up next time round.
      if (hasUnsent()){ commitDone(); $('#update').hidden = false; return; }

      // if he is mid note, let him finish and offer the button instead
      var busy = document.activeElement && document.activeElement.tagName === 'TEXTAREA';
      if (busy){ $('#update').hidden = false; return; }

      location.replace(freshUrl(live));
    })
    .catch(function (){});
}
$('#update').addEventListener('click', function (){
  commitDone();
  setTimeout(function (){ location.replace(freshUrl(Date.now())); }, 300);
});

push();
load();
loadToday();
checkBuild();
setInterval(checkBuild, 120000);
// keep the scoreboard honest while he works
setInterval(function (){ loadToday(); }, 180000);
</script>
